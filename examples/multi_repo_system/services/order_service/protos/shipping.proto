syntax = "proto3";

package shipping;

service ShippingService {
  rpc GetQuote(QuoteRequest) returns (QuoteResponse);
  rpc ShipOrder(ShipRequest) returns (ShipResponse);
}

message QuoteRequest {
  string order_id = 1;
  int32 item_count = 2;
}

message QuoteResponse {
  double cost = 1;
}

message ShipRequest {
  string order_id = 1;
  string address = 2;
}

message ShipResponse {
  string tracking_number = 1;
  string status = 2;
}
