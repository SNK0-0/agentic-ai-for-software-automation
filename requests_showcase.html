  <script>window.STANDALONE_DATA = {"repo_name": "requests", "nodes": [{"id": "file::__init__.py", "label": "__init__.py", "title": "file::__init__.py [Lsyn]", "type": "file", "layer": "Lsyn", "file": "__init__.py", "line": 1, "shape": "dot", "color": {"background": "#ea580c", "border": "#ffffff"}, "size": 20, "docstring": "Requests HTTP Library\n~~~~~~~~~~~~~~~~~~~~~\n\nRequests is an HTTP library, written in Python, for human beings.\nBasic GET usage:\n\n   >>> import requests\n   >>> r = requests.get('https://www.python.org')\n   >>> r.status_code\n   200\n   >>> b'Python is a programming language' in r.content\n   True\n\n... or POST:\n\n   >>> payload = dict(key1='value1', key2='value2')\n   >>> r = requests.post('https://httpbin.org/post', data=payload)\n   >>> print(r.text)\n   {\n     ...\n     \"form\": {\n       \"key1\": \"value1\",\n       \"key2\": \"value2\"\n     },\n     ...\n   }\n\nThe other HTTP methods are supported - see `requests.api`. Full documentation\nis at <https://requests.readthedocs.io>.\n\n:copyright: (c) 2017 by Kenneth Reitz.\n:license: Apache 2.0, see LICENSE for more details.", "code": "# File: __init__.py\n# Lines: 183"}, {"id": "module::warnings", "label": "warnings", "title": "module::warnings [Ldep]", "type": "module", "layer": "Ldep", "file": "__init__.py", "line": 0, "shape": "dot", "color": {"background": "#0891b2", "border": "#ffffff"}, "size": 18, "docstring": "", "code": ""}, {"id": "module::urllib3", "label": "urllib3", "title": "module::urllib3 [Ldep]", "type": "module", "layer": "Ldep", "file": "__init__.py", "line": 0, "shape": "dot", "color": {"background": "#0891b2", "border": "#ffffff"}, "size": 18, "docstring": "", "code": ""}, {"id": "module::ssl", "label": "ssl", "title": "module::ssl [Ldep]", "type": "module", "layer": "Ldep", "file": "__init__.py", "line": 0, "shape": "dot", "color": {"background": "#0891b2", "border": "#ffffff"}, "size": 18, "docstring": "", "code": ""}, {"id": "module::logging", "label": "logging", "title": "module::logging [Ldep]", "type": "module", "layer": "Ldep", "file": "__init__.py", "line": 0, "shape": "dot", "color": {"background": "#0891b2", "border": "#ffffff"}, "size": 18, "docstring": "", "code": ""}, {"id": "file::__version__.py", "label": "__version__.py", "title": "file::__version__.py [Lsyn]", "type": "file", "layer": "Lsyn", "file": "__version__.py", "line": 1, "shape": "dot", "color": {"background": "#ea580c", "border": "#ffffff"}, "size": 20, "docstring": "", "code": "# File: __version__.py\n# Lines: 14"}, {"id": "file::_internal_utils.py", "label": "_internal_utils.py", "title": "file::_internal_utils.py [Lsyn]", "type": "file", "layer": "Lsyn", "file": "_internal_utils.py", "line": 1, "shape": "dot", "color": {"background": "#ea580c", "border": "#ffffff"}, "size": 20, "docstring": "requests._internal_utils\n~~~~~~~~~~~~~~\n\nProvides utility functions that are consumed internally by Requests\nwhich depend on extremely few external helpers (such as compat)", "code": "# File: _internal_utils.py\n# Lines: 51"}, {"id": "module::re", "label": "re", "title": "module::re [Ldep]", "type": "module", "layer": "Ldep", "file": "_internal_utils.py", "line": 0, "shape": "dot", "color": {"background": "#0891b2", "border": "#ffffff"}, "size": 18, "docstring": "", "code": ""}, {"id": "file::adapters.py", "label": "adapters.py", "title": "file::adapters.py [Lsyn]", "type": "file", "layer": "Lsyn", "file": "adapters.py", "line": 1, "shape": "dot", "color": {"background": "#ea580c", "border": "#ffffff"}, "size": 20, "docstring": "requests.adapters\n~~~~~~~~~~~~~~~~~\n\nThis module contains the transport adapters that Requests uses to define\nand maintain connections.", "code": "# File: adapters.py\n# Lines: 697"}, {"id": "module::os.path", "label": "os.path", "title": "module::os.path [Ldep]", "type": "module", "layer": "Ldep", "file": "adapters.py", "line": 0, "shape": "dot", "color": {"background": "#0891b2", "border": "#ffffff"}, "size": 18, "docstring": "", "code": ""}, {"id": "module::socket", "label": "socket", "title": "module::socket [Ldep]", "type": "module", "layer": "Ldep", "file": "adapters.py", "line": 0, "shape": "dot", "color": {"background": "#0891b2", "border": "#ffffff"}, "size": 18, "docstring": "", "code": ""}, {"id": "module::typing", "label": "typing", "title": "module::typing [Ldep]", "type": "module", "layer": "Ldep", "file": "adapters.py", "line": 0, "shape": "dot", "color": {"background": "#0891b2", "border": "#ffffff"}, "size": 18, "docstring": "", "code": ""}, {"id": "adapters.py:BaseAdapter", "label": "BaseAdapter", "title": "adapters.py:BaseAdapter [Lsyn]", "type": "class", "layer": "Lsyn", "file": "adapters.py", "line": 114, "shape": "dot", "color": {"background": "#16a34a", "border": "#ffffff"}, "size": 16, "docstring": "The Base Transport Adapter", "code": "class BaseAdapter:\n    \"\"\"The Base Transport Adapter\"\"\"\n\n    def __init__(self):\n        super().__init__()\n\n    def send(\n        self, request, stream=False, timeout=None, verify=True, cert=None, proxies=None\n    ):\n        \"\"\"Sends PreparedRequest object. Returns Response object.\n\n        :param request: The :class:`PreparedRequest <PreparedRequest>` being sent.\n        :param stream: (optional) Whether to stream the request content.\n        :param timeout: (optional) How long to wait for the server to send\n            data before giving up, as a float, or a :ref:`(connect timeout,\n            read timeout) <timeouts>` tuple.\n        :type timeout: float or tuple\n        :param verify: (optional) Either a boolean, in which case it controls whether we verify\n            the server's TLS certificate, or a string, in which case it must be a path\n            to a CA bundle to use\n        :param cert: (optional) Any user-provided SSL certificate to be trusted.\n        :param proxies: (optional) The proxies dictionary to apply to the request.\n        \"\"\"\n        raise NotImplementedError\n\n    def close(self):\n        \"\"\"Cleans up adapter specific items.\"\"\"\n        raise NotImplementedError"}, {"id": "adapters.py:HTTPAdapter", "label": "HTTPAdapter", "title": "adapters.py:HTTPAdapter [Lsyn]", "type": "class", "layer": "Lsyn", "file": "adapters.py", "line": 144, "shape": "dot", "color": {"background": "#16a34a", "border": "#ffffff"}, "size": 16, "docstring": "The built-in HTTP Adapter for urllib3.\n\nProvides a general-case interface for Requests sessions to contact HTTP and\nHTTPS urls by implementing the Transport Adapter interface. This class will\nusually be created by the :class:`Session <Session>` class under the\ncovers.\n\n:param pool_connections: The number of urllib3 connection pools to cache.\n:param pool_maxsize: The maximum number of connections to save in the pool.\n:param max_retries: The maximum number of retries each connection\n    should attempt. Note, this applies only to failed DNS lookups, socket\n    connections and connection timeouts, never to requests where data has\n    made it to the server. By default, Requests does not retry failed\n    connections. If you need granular control over the conditions under\n    which we retry a request, import urllib3's ``Retry`` class and pass\n    that instead.\n:param pool_block: Whether the connection pool should block for connections.\n\nUsage::\n\n  >>> import requests\n  >>> s = requests.Session()\n  >>> a = requests.adapters.HTTPAdapter(max_retries=3)\n  >>> s.mount('http://', a)", "code": "class HTTPAdapter(BaseAdapter):\n    \"\"\"The built-in HTTP Adapter for urllib3.\n\n    Provides a general-case interface for Requests sessions to contact HTTP and\n    HTTPS urls by implementing the Transport Adapter interface. This class will\n    usually be created by the :class:`Session <Session>` class under the\n    covers.\n\n    :param pool_connections: The number of urllib3 connection pools to cache.\n    :param pool_maxsize: The maximum number of connections to save in the pool.\n    :param max_retries: The maximum number of retries each connection\n        should attempt. Note, this applies only to failed DNS lookups, socket\n        connections and connection timeouts, never to requests where data has\n        made it to the server. By default, Requests does not retry failed\n        connections. If you need granular control over the conditions under\n        which we retry a request, import urllib3's ``Retry`` class and pass\n        that instead.\n    :param pool_block: Whether the connection pool should block for connections.\n\n    Usage::\n\n      >>> import requests\n      >>> s = requests.Session()\n      >>> a = requests.adapters.HTTPAdapter(max_retries=3)\n      >>> s.mount('http://', a)\n    \"\"\"\n\n    __attrs__ = [\n        \"max_retries\",\n        \"config\",\n        \"_pool_connections\",\n        \"_pool_maxsize\",\n        \"_pool_block\",\n    ]\n\n    def __init__(\n        self,\n        pool_connections=DEFAULT_POOLSIZE,\n        pool_maxsize=DEFAULT_POOLSIZE,\n        max_retries=DEFAULT_RETRIES,\n        pool_block=DEFAULT_POOLBLOCK,\n    ):\n        if max_retries == DEFAULT_RETRIES:\n            self.max_retries = Retry(0, read=False)\n        else:\n            self.max_retries = Retry.from_int(max_retries)\n        self.config = {}\n        self.proxy_manager = {}\n\n        super().__init__()\n\n        self._pool_connections = pool_connections\n        self._pool_maxsize = pool_maxsize\n        self._pool_block = pool_block\n\n        self.init_poolmanager(pool_connections, pool_maxsize, block=pool_block)\n\n    def __getstate__(self):\n        return {attr: getattr(self, attr, None) for attr in self.__attrs__}\n\n    def __setstate__(self, state):\n        # Can't handle by adding 'proxy_manager' to self.__attrs__ because\n        # self.poolmanager uses a lambda function, which isn't pickleable.\n        self.proxy_manager = {}\n        self.config = {}\n\n        for attr, value in state.items():\n            setattr(self, attr, value)\n\n        self.init_poolmanager(\n            self._pool_connections, self._pool_maxsize, block=self._pool_block\n        )\n\n    def init_poolmanager(\n        self, connections, maxsize, block=DEFAULT_POOLBLOCK, **pool_kwargs\n    ):\n        \"\"\"Initializes a urllib3 PoolManager.\n\n        This method should not be called from user code, and is only\n        exposed for use when subclassing the\n        :class:`HTTPAdapter <requests.adapters.HTTPAdapter>`.\n\n        :param connections: The number of urllib3 connection pools to cache.\n        :param maxsize: The maximum number of connections to save in the pool.\n        :param block: Block when no free connections are available.\n        :param pool_kwargs: Extra keyword arguments used to initialize the Pool Manager.\n        \"\"\"\n        # save these values for pickling\n        self._pool_connections = connections\n        self._pool_maxsize = maxsize\n        self._pool_block = block\n\n        self.poolmanager = PoolManager(\n            num_pools=connections,\n            maxsize=maxsize,\n            block=block,\n            **pool_kwargs,\n        )\n\n    def proxy_manager_for(self, proxy, **proxy_kwargs):\n        \"\"\"Return urllib3 ProxyManager for the given proxy.\n\n        This method should not be called from user code, and is only\n        exposed for use when subclassing the\n        :class:`HTTPAdapter <requests.adapters.HTTPAdapter>`.\n\n        :param proxy: The proxy to return a urllib3 ProxyManager for.\n        :param proxy_kwargs: Extra keyword arguments used to configure the Proxy Manager.\n        :returns: ProxyManager\n        :rtype: urllib3.ProxyManager\n        \"\"\"\n        if proxy in self.proxy_manager:\n            manager = self.proxy_manager[proxy]\n        elif proxy.lower().startswith(\"socks\"):\n            username, password = get_auth_from_url(proxy)\n            manager = self.proxy_manager[proxy] = SOCKSProxyManager(\n                proxy,\n                username=username,\n                password=password,\n                num_pools=self._pool_connections,\n                maxsize=self._pool_maxsize,\n                block=self._pool_block,\n                **proxy_kwargs,\n            )\n        else:\n            proxy_headers = self.proxy_headers(proxy)\n            manager = self.proxy_manager[proxy] = proxy_from_url(\n                proxy,\n                proxy_headers=proxy_headers,\n                num_pools=self._pool_connections,\n                maxsize=self._pool_maxsize,\n                block=self._pool_block,\n                **proxy_kwargs,\n            )\n\n        return manager\n\n    def cert_verify(self, conn, url, verify, cert):\n        \"\"\"Verify a SSL certificate. This method should not be called from user\n        code, and is only exposed for use when subclassing the\n        :class:`HTTPAdapter <requests.adapters.HTTPAdapter>`.\n\n        :param conn: The urllib3 connection object associated with the cert.\n        :param url: The requested URL.\n        :param verify: Either a boolean, in which case it controls whether we verify\n            the server's TLS certificate, or a string, in which case it must be a path\n            to a CA bundle to use\n        :param cert: The SSL certificate to verify.\n        \"\"\"\n        if url.lower().startswith(\"https\") and verify:\n            cert_loc = None\n\n            # Allow self-specified cert location.\n            if verify is not True:\n                cert_loc = verify\n\n            if not cert_loc:\n                cert_loc = DEFAULT_CA_BUNDLE_PATH\n\n            if not cert_loc or not os.path.exists(cert_loc):\n                raise OSError(\n                    f\"Could not find a suitable TLS CA certificate bundle, \"\n                    f\"invalid path: {cert_loc}\"\n                )\n\n            conn.cert_reqs = \"CERT_REQUIRED\"\n\n            if not os.path.isdir(cert_loc):\n                conn.ca_certs = cert_loc\n            else:\n                conn.ca_cert_dir = cert_loc\n        else:\n            conn.cert_reqs = \"CERT_NONE\"\n            conn.ca_certs = None\n            conn.ca_cert_dir = None\n\n        if cert:\n            if not isinstance(cert, basestring):\n                conn.cert_file = cert[0]\n                conn.key_file = cert[1]\n            else:\n                conn.cert_file = cert\n                conn.key_file = None\n            if conn.cert_file and not os.path.exists(conn.cert_file):\n                raise OSError(\n                    f\"Could not find the TLS certificate file, \"\n                    f\"invalid path: {conn.cert_file}\"\n                )\n            if conn.key_file and not os.path.exists(conn.key_file):\n                raise OSError(\n                    f\"Could not find the TLS key file, invalid path: {conn.key_file}\"\n                )\n\n    def build_response(self, req, resp):\n        \"\"\"Builds a :class:`Response <requests.Response>` object from a urllib3\n        response. This should not be called from user code, and is only exposed\n        for use when subclassing the\n        :class:`HTTPAdapter <requests.adapters.HTTPAdapter>`\n\n        :param req: The :class:`PreparedRequest <PreparedRequest>` used to generate the response.\n        :param resp: The urllib3 response object.\n        :rtype: requests.Response\n        \"\"\"\n        response = Response()\n\n        # Fallback to None if there's no status_code, for whatever reason.\n        response.status_code = getattr(resp, \"status\", None)\n\n        # Make headers case-insensitive.\n        response.headers = CaseInsensitiveDict(getattr(resp, \"headers\", {}))\n\n        # Set encoding.\n        response.encoding = get_encoding_from_headers(response.headers)\n        response.raw = resp\n        response.reason = response.raw.reason\n\n        if isinstance(req.url, bytes):\n            response.url = req.url.decode(\"utf-8\")\n        else:\n            response.url = req.url\n\n        # Add new cookies from the server.\n        extract_cookies_to_jar(response.cookies, req, resp)\n\n        # Give the Response some context.\n        response.request = req\n        response.connection = self\n\n        return response\n\n    def build_connection_pool_key_attributes(self, request, verify, cert=None):\n        \"\"\"Build the PoolKey attributes used by urllib3 to return a connection.\n\n        This looks at the PreparedRequest, the user-specified verify value,\n        and the value of the cert parameter to determine what PoolKey values\n        to use to select a connection from a given urllib3 Connection Pool.\n\n        The SSL related pool key arguments are not consistently set. As of\n        this writing, use the following to determine what keys may be in that\n        dictionary:\n\n        * If ``verify`` is ``True``, ``\"ssl_context\"`` will be set and will be the\n          default Requests SSL Context\n        * If ``verify`` is ``False``, ``\"ssl_context\"`` will not be set but\n          ``\"cert_reqs\"`` will be set\n        * If ``verify`` is a string, (i.e., it is a user-specified trust bundle)\n          ``\"ca_certs\"`` will be set if the string is not a directory recognized\n          by :py:func:`os.path.isdir`, otherwise ``\"ca_cert_dir\"`` will be\n          set.\n        * If ``\"cert\"`` is specified, ``\"cert_file\"`` will always be set. If\n          ``\"cert\"`` is a tuple with a second item, ``\"key_file\"`` will also\n          be present\n\n        To override these settings, one may subclass this class, call this\n        method and use the above logic to change parameters as desired. For\n        example, if one wishes to use a custom :py:class:`ssl.SSLContext` one\n        must both set ``\"ssl_context\"`` and based on what else they require,\n        alter the other keys to ensure the desired behaviour.\n\n        :param request:\n            The PreparedReqest being sent over the connection.\n        :type request:\n            :class:`~requests.models.PreparedRequest`\n        :param verify:\n            Either a boolean, in which case it controls whether\n            we verify the server's TLS certificate, or a string, in which case it\n            must be a path to a CA bundle to use.\n        :param cert:\n            (optional) Any user-provided SSL certificate for client\n            authentication (a.k.a., mTLS). This may be a string (i.e., just\n            the path to a file which holds both certificate and key) or a\n            tuple of length 2 with the certificate file path and key file\n            path.\n        :returns:\n            A tuple of two dictionaries. The first is the \"host parameters\"\n            portion of the Pool Key including scheme, hostname, and port. The\n            second is a dictionary of SSLContext related parameters.\n        \"\"\"\n        return _urllib3_request_context(request, verify, cert, self.poolmanager)\n\n    def get_connection_with_tls_context(self, request, verify, proxies=None, cert=None):\n        \"\"\"Returns a urllib3 connection for the given request and TLS settings.\n        This should not be called from user code, and is only exposed for use\n        when subclassing the :class:`HTTPAdapter <requests.adapters.HTTPAdapter>`.\n\n        :param request:\n            The :class:`PreparedRequest <PreparedRequest>` object to be sent\n            over the connection.\n        :param verify:\n            Either a boolean, in which case it controls whether we verify the\n            server's TLS certificate, or a string, in which case it must be a\n            path to a CA bundle to use.\n        :param proxies:\n            (optional) The proxies dictionary to apply to the request.\n        :param cert:\n            (optional) Any user-provided SSL certificate to be used for client\n            authentication (a.k.a., mTLS).\n        :rtype:\n            urllib3.ConnectionPool\n        \"\"\"\n        proxy = select_proxy(request.url, proxies)\n        try:\n            host_params, pool_kwargs = self.build_connection_pool_key_attributes(\n                request,\n                verify,\n                cert,\n            )\n        except ValueError as e:\n            raise InvalidURL(e, request=request)\n        if proxy:\n            proxy = prepend_scheme_if_needed(proxy, \"http\")\n            proxy_url = parse_url(proxy)\n            if not proxy_url.host:\n                raise InvalidProxyURL(\n                    \"Please check proxy URL. It is malformed \"\n                    \"and could be missing the host.\"\n                )\n            proxy_manager = self.proxy_manager_for(proxy)\n            conn = proxy_manager.connection_from_host(\n                **host_params, pool_kwargs=pool_kwargs\n            )\n        else:\n            # Only scheme should be lower case\n            conn = self.poolmanager.connection_from_host(\n                **host_params, pool_kwargs=pool_kwargs\n            )\n\n        return conn\n\n    def get_connection(self, url, proxies=None):\n        \"\"\"DEPRECATED: Users should move to `get_connection_with_tls_context`\n        for all subclasses of HTTPAdapter using Requests>=2.32.2.\n\n        Returns a urllib3 connection for the given URL. This should not be\n        called from user code, and is only exposed for use when subclassing the\n        :class:`HTTPAdapter <requests.adapters.HTTPAdapter>`.\n\n        :param url: The URL to connect to.\n        :param proxies: (optional) A Requests-style dictionary of proxies used on this request.\n        :rtype: urllib3.ConnectionPool\n        \"\"\"\n        warnings.warn(\n            (\n                \"`get_connection` has been deprecated in favor of \"\n                \"`get_connection_with_tls_context`. Custom HTTPAdapter subclasses \"\n                \"will need to migrate for Requests>=2.32.2. Please see \"\n                \"https://github.com/psf/requests/pull/6710 for more details.\"\n            ),\n            DeprecationWarning,\n        )\n        proxy = select_proxy(url, proxies)\n\n        if proxy:\n            proxy = prepend_scheme_if_needed(proxy, \"http\")\n            proxy_url = parse_url(proxy)\n            if not proxy_url.host:\n                raise InvalidProxyURL(\n                    \"Please check proxy URL. It is malformed \"\n                    \"and could be missing the host.\"\n                )\n            proxy_manager = self.proxy_manager_for(proxy)\n            conn = proxy_manager.connection_from_url(url)\n        else:\n            # Only scheme should be lower case\n            parsed = urlparse(url)\n            url = parsed.geturl()\n            conn = self.poolmanager.connection_from_url(url)\n\n        return conn\n\n    def close(self):\n        \"\"\"Disposes of any internal state.\n\n        Currently, this closes the PoolManager and any active ProxyManager,\n        which closes any pooled connections.\n        \"\"\"\n        self.poolmanager.clear()\n        for proxy in self.proxy_manager.values():\n            proxy.clear()\n\n    def request_url(self, request, proxies):\n        \"\"\"Obtain the url to use when making the final request.\n\n        If the message is being sent through a HTTP proxy, the full URL has to\n        be used. Otherwise, we should only use the path portion of the URL.\n\n        This should not be called from user code, and is only exposed for use\n        when subclassing the\n        :class:`HTTPAdapter <requests.adapters.HTTPAdapter>`.\n\n        :param request: The :class:`PreparedRequest <PreparedRequest>` being sent.\n        :param proxies: A dictionary of schemes or schemes and hosts to proxy URLs.\n        :rtype: str\n        \"\"\"\n        proxy = select_proxy(request.url, proxies)\n        scheme = urlparse(request.url).scheme\n\n        is_proxied_http_request = proxy and scheme != \"https\"\n        using_socks_proxy = False\n        if proxy:\n            proxy_scheme = urlparse(proxy).scheme.lower()\n            using_socks_proxy = proxy_scheme.startswith(\"socks\")\n\n        url = request.path_url\n        if url.startswith(\"//\"):  # Don't confuse urllib3\n            url = f\"/{url.lstrip('/')}\"\n\n        if is_proxied_http_request and not using_socks_proxy:\n            url = urldefragauth(request.url)\n\n        return url\n\n    def add_headers(self, request, **kwargs):\n        \"\"\"Add any headers needed by the connection. As of v2.0 this does\n        nothing by default, but is left for overriding by users that subclass\n        the :class:`HTTPAdapter <requests.adapters.HTTPAdapter>`.\n\n        This should not be called from user code, and is only exposed for use\n        when subclassing the\n        :class:`HTTPAdapter <requests.adapters.HTTPAdapter>`.\n\n        :param request: The :class:`PreparedRequest <PreparedRequest>` to add headers to.\n        :param kwargs: The keyword arguments from the call to send().\n        \"\"\"\n        pass\n\n    def proxy_headers(self, proxy):\n        \"\"\"Returns a dictionary of the headers to add to any request sent\n        through a proxy. This works with urllib3 magic to ensure that they are\n        correctly sent to the proxy, rather than in a tunnelled request if\n        CONNECT is being used.\n\n        This should not be called from user code, and is only exposed for use\n        when subclassing the\n        :class:`HTTPAdapter <requests.adapters.HTTPAdapter>`.\n\n        :param proxy: The url of the proxy being used for this request.\n        :rtype: dict\n        \"\"\"\n        headers = {}\n        username, password = get_auth_from_url(proxy)\n\n        if username:\n            headers[\"Proxy-Authorization\"] = _basic_auth_str(username, password)\n\n        return headers\n\n    def send(\n        self, request, stream=False, timeout=None, verify=True, cert=None, proxies=None\n    ):\n        \"\"\"Sends PreparedRequest object. Returns Response object.\n\n        :param request: The :class:`PreparedRequest <PreparedRequest>` being sent.\n        :param stream: (optional) Whether to stream the request content.\n        :param timeout: (optional) How long to wait for the server to send\n            data before giving up, as a float, or a :ref:`(connect timeout,\n            read timeout) <timeouts>` tuple.\n        :type timeout: float or tuple or urllib3 Timeout object\n        :param verify: (optional) Either a boolean, in which case it controls whether\n            we verify the server's TLS certificate, or a string, in which case it\n            must be a path to a CA bundle to use\n        :param cert: (optional) Any user-provided SSL certificate to be trusted.\n        :param proxies: (optional) The proxies dictionary to apply to the request.\n        :rtype: requests.Response\n        \"\"\"\n\n        try:\n            conn = self.get_connection_with_tls_context(\n                request, verify, proxies=proxies, cert=cert\n            )\n        except LocationValueError as e:\n            raise InvalidURL(e, request=request)\n\n        self.cert_verify(conn, request.url, verify, cert)\n        url = self.request_url(request, proxies)\n        self.add_headers(\n            request,\n            stream=stream,\n            timeout=timeout,\n            verify=verify,\n            cert=cert,\n            proxies=proxies,\n        )\n\n        chunked = not (request.body is None or \"Content-Length\" in request.headers)\n\n        if isinstance(timeout, tuple):\n            try:\n                connect, read = timeout\n                timeout = TimeoutSauce(connect=connect, read=read)\n            except ValueError:\n                raise ValueError(\n                    f\"Invalid timeout {timeout}. Pass a (connect, read) timeout tuple, \"\n                    f\"or a single float to set both timeouts to the same value.\"\n                )\n        elif isinstance(timeout, TimeoutSauce):\n            pass\n        else:\n            timeout = TimeoutSauce(connect=timeout, read=timeout)\n\n        try:\n            resp = conn.urlopen(\n                method=request.method,\n                url=url,\n                body=request.body,\n                headers=request.headers,\n                redirect=False,\n                assert_same_host=False,\n                preload_content=False,\n                decode_content=False,\n                retries=self.max_retries,\n                timeout=timeout,\n                chunked=chunked,\n            )\n\n        except (ProtocolError, OSError) as err:\n            raise ConnectionError(err, request=request)\n\n        except MaxRetryError as e:\n            if isinstance(e.reason, ConnectTimeoutError):\n                # TODO: Remove this in 3.0.0: see #2811\n                if not isinstance(e.reason, NewConnectionError):\n                    raise ConnectTimeout(e, request=request)\n\n            if isinstance(e.reason, ResponseError):\n                raise RetryError(e, request=request)\n\n            if isinstance(e.reason, _ProxyError):\n                raise ProxyError(e, request=request)\n\n            if isinstance(e.reason, _SSLError):\n                # This branch is for urllib3 v1.22 and later.\n                raise SSLError(e, request=request)\n\n            raise ConnectionError(e, request=request)\n\n        except ClosedPoolError as e:\n            raise ConnectionError(e, request=request)\n\n        except _ProxyError as e:\n            raise ProxyError(e)\n\n        except (_SSLError, _HTTPError) as e:\n            if isinstance(e, _SSLError):\n                # This branch is for urllib3 versions earlier than v1.22\n                raise SSLError(e, request=request)\n            elif isinstance(e, ReadTimeoutError):\n                raise ReadTimeout(e, request=request)\n            elif isinstance(e, _InvalidHeader):\n                raise InvalidHeader(e, request=request)\n            else:\n                raise\n\n        return self.build_response(request, resp)"}, {"id": "file::api.py", "label": "api.py", "title": "file::api.py [Lsyn]", "type": "file", "layer": "Lsyn", "file": "api.py", "line": 1, "shape": "dot", "color": {"background": "#ea580c", "border": "#ffffff"}, "size": 20, "docstring": "requests.api\n~~~~~~~~~~~~\n\nThis module implements the Requests API.\n\n:copyright: (c) 2012 by Kenneth Reitz.\n:license: Apache2, see LICENSE for more details.", "code": "# File: api.py\n# Lines: 157"}, {"id": "file::auth.py", "label": "auth.py", "title": "file::auth.py [Lsyn]", "type": "file", "layer": "Lsyn", "file": "auth.py", "line": 1, "shape": "dot", "color": {"background": "#ea580c", "border": "#ffffff"}, "size": 20, "docstring": "requests.auth\n~~~~~~~~~~~~~\n\nThis module contains the authentication handlers for Requests.", "code": "# File: auth.py\n# Lines: 314"}, {"id": "module::hashlib", "label": "hashlib", "title": "module::hashlib [Ldep]", "type": "module", "layer": "Ldep", "file": "auth.py", "line": 0, "shape": "dot", "color": {"background": "#0891b2", "border": "#ffffff"}, "size": 18, "docstring": "", "code": ""}, {"id": "module::os", "label": "os", "title": "module::os [Ldep]", "type": "module", "layer": "Ldep", "file": "auth.py", "line": 0, "shape": "dot", "color": {"background": "#0891b2", "border": "#ffffff"}, "size": 18, "docstring": "", "code": ""}, {"id": "module::threading", "label": "threading", "title": "module::threading [Ldep]", "type": "module", "layer": "Ldep", "file": "auth.py", "line": 0, "shape": "dot", "color": {"background": "#0891b2", "border": "#ffffff"}, "size": 18, "docstring": "", "code": ""}, {"id": "module::time", "label": "time", "title": "module::time [Ldep]", "type": "module", "layer": "Ldep", "file": "auth.py", "line": 0, "shape": "dot", "color": {"background": "#0891b2", "border": "#ffffff"}, "size": 18, "docstring": "", "code": ""}, {"id": "auth.py:AuthBase", "label": "AuthBase", "title": "auth.py:AuthBase [Lsyn]", "type": "class", "layer": "Lsyn", "file": "auth.py", "line": 69, "shape": "dot", "color": {"background": "#16a34a", "border": "#ffffff"}, "size": 16, "docstring": "Base class that all auth implementations derive from", "code": "class AuthBase:\n    \"\"\"Base class that all auth implementations derive from\"\"\"\n\n    def __call__(self, r):\n        raise NotImplementedError(\"Auth hooks must be callable.\")"}, {"id": "auth.py:HTTPBasicAuth", "label": "HTTPBasicAuth", "title": "auth.py:HTTPBasicAuth [Lsyn]", "type": "class", "layer": "Lsyn", "file": "auth.py", "line": 76, "shape": "dot", "color": {"background": "#16a34a", "border": "#ffffff"}, "size": 16, "docstring": "Attaches HTTP Basic Authentication to the given Request object.", "code": "class HTTPBasicAuth(AuthBase):\n    \"\"\"Attaches HTTP Basic Authentication to the given Request object.\"\"\"\n\n    def __init__(self, username, password):\n        self.username = username\n        self.password = password\n\n    def __eq__(self, other):\n        return all(\n            [\n                self.username == getattr(other, \"username\", None),\n                self.password == getattr(other, \"password\", None),\n            ]\n        )\n\n    def __ne__(self, other):\n        return not self == other\n\n    def __call__(self, r):\n        r.headers[\"Authorization\"] = _basic_auth_str(self.username, self.password)\n        return r"}, {"id": "auth.py:HTTPProxyAuth", "label": "HTTPProxyAuth", "title": "auth.py:HTTPProxyAuth [Lsyn]", "type": "class", "layer": "Lsyn", "file": "auth.py", "line": 99, "shape": "dot", "color": {"background": "#16a34a", "border": "#ffffff"}, "size": 16, "docstring": "Attaches HTTP Proxy Authentication to a given Request object.", "code": "class HTTPProxyAuth(HTTPBasicAuth):\n    \"\"\"Attaches HTTP Proxy Authentication to a given Request object.\"\"\"\n\n    def __call__(self, r):\n        r.headers[\"Proxy-Authorization\"] = _basic_auth_str(self.username, self.password)\n        return r"}, {"id": "auth.py:HTTPDigestAuth", "label": "HTTPDigestAuth", "title": "auth.py:HTTPDigestAuth [Lsyn]", "type": "class", "layer": "Lsyn", "file": "auth.py", "line": 107, "shape": "dot", "color": {"background": "#16a34a", "border": "#ffffff"}, "size": 16, "docstring": "Attaches HTTP Digest Authentication to the given Request object.", "code": "class HTTPDigestAuth(AuthBase):\n    \"\"\"Attaches HTTP Digest Authentication to the given Request object.\"\"\"\n\n    def __init__(self, username, password):\n        self.username = username\n        self.password = password\n        # Keep state in per-thread local storage\n        self._thread_local = threading.local()\n\n    def init_per_thread_state(self):\n        # Ensure state is initialized just once per-thread\n        if not hasattr(self._thread_local, \"init\"):\n            self._thread_local.init = True\n            self._thread_local.last_nonce = \"\"\n            self._thread_local.nonce_count = 0\n            self._thread_local.chal = {}\n            self._thread_local.pos = None\n            self._thread_local.num_401_calls = None\n\n    def build_digest_header(self, method, url):\n        \"\"\"\n        :rtype: str\n        \"\"\"\n\n        realm = self._thread_local.chal[\"realm\"]\n        nonce = self._thread_local.chal[\"nonce\"]\n        qop = self._thread_local.chal.get(\"qop\")\n        algorithm = self._thread_local.chal.get(\"algorithm\")\n        opaque = self._thread_local.chal.get(\"opaque\")\n        hash_utf8 = None\n\n        if algorithm is None:\n            _algorithm = \"MD5\"\n        else:\n            _algorithm = algorithm.upper()\n        # lambdas assume digest modules are imported at the top level\n        if _algorithm == \"MD5\" or _algorithm == \"MD5-SESS\":\n\n            def md5_utf8(x):\n                if isinstance(x, str):\n                    x = x.encode(\"utf-8\")\n                return hashlib.md5(x).hexdigest()\n\n            hash_utf8 = md5_utf8\n        elif _algorithm == \"SHA\":\n\n            def sha_utf8(x):\n                if isinstance(x, str):\n                    x = x.encode(\"utf-8\")\n                return hashlib.sha1(x).hexdigest()\n\n            hash_utf8 = sha_utf8\n        elif _algorithm == \"SHA-256\":\n\n            def sha256_utf8(x):\n                if isinstance(x, str):\n                    x = x.encode(\"utf-8\")\n                return hashlib.sha256(x).hexdigest()\n\n            hash_utf8 = sha256_utf8\n        elif _algorithm == \"SHA-512\":\n\n            def sha512_utf8(x):\n                if isinstance(x, str):\n                    x = x.encode(\"utf-8\")\n                return hashlib.sha512(x).hexdigest()\n\n            hash_utf8 = sha512_utf8\n\n        KD = lambda s, d: hash_utf8(f\"{s}:{d}\")  # noqa:E731\n\n        if hash_utf8 is None:\n            return None\n\n        # XXX not implemented yet\n        entdig = None\n        p_parsed = urlparse(url)\n        #: path is request-uri defined in RFC 2616 which should not be empty\n        path = p_parsed.path or \"/\"\n        if p_parsed.query:\n            path += f\"?{p_parsed.query}\"\n\n        A1 = f\"{self.username}:{realm}:{self.password}\"\n        A2 = f\"{method}:{path}\"\n\n        HA1 = hash_utf8(A1)\n        HA2 = hash_utf8(A2)\n\n        if nonce == self._thread_local.last_nonce:\n            self._thread_local.nonce_count += 1\n        else:\n            self._thread_local.nonce_count = 1\n        ncvalue = f\"{self._thread_local.nonce_count:08x}\"\n        s = str(self._thread_local.nonce_count).encode(\"utf-8\")\n        s += nonce.encode(\"utf-8\")\n        s += time.ctime().encode(\"utf-8\")\n        s += os.urandom(8)\n\n        cnonce = hashlib.sha1(s).hexdigest()[:16]\n        if _algorithm == \"MD5-SESS\":\n            HA1 = hash_utf8(f\"{HA1}:{nonce}:{cnonce}\")\n\n        if not qop:\n            respdig = KD(HA1, f\"{nonce}:{HA2}\")\n        elif qop == \"auth\" or \"auth\" in qop.split(\",\"):\n            noncebit = f\"{nonce}:{ncvalue}:{cnonce}:auth:{HA2}\"\n            respdig = KD(HA1, noncebit)\n        else:\n            # XXX handle auth-int.\n            return None\n\n        self._thread_local.last_nonce = nonce\n\n        # XXX should the partial digests be encoded too?\n        base = (\n            f'username=\"{self.username}\", realm=\"{realm}\", nonce=\"{nonce}\", '\n            f'uri=\"{path}\", response=\"{respdig}\"'\n        )\n        if opaque:\n            base += f', opaque=\"{opaque}\"'\n        if algorithm:\n            base += f', algorithm=\"{algorithm}\"'\n        if entdig:\n            base += f', digest=\"{entdig}\"'\n        if qop:\n            base += f', qop=\"auth\", nc={ncvalue}, cnonce=\"{cnonce}\"'\n\n        return f\"Digest {base}\"\n\n    def handle_redirect(self, r, **kwargs):\n        \"\"\"Reset num_401_calls counter on redirects.\"\"\"\n        if r.is_redirect:\n            self._thread_local.num_401_calls = 1\n\n    def handle_401(self, r, **kwargs):\n        \"\"\"\n        Takes the given response and tries digest-auth, if needed.\n\n        :rtype: requests.Response\n        \"\"\"\n\n        # If response is not 4xx, do not auth\n        # See https://github.com/psf/requests/issues/3772\n        if not 400 <= r.status_code < 500:\n            self._thread_local.num_401_calls = 1\n            return r\n\n        if self._thread_local.pos is not None:\n            # Rewind the file position indicator of the body to where\n            # it was to resend the request.\n            r.request.body.seek(self._thread_local.pos)\n        s_auth = r.headers.get(\"www-authenticate\", \"\")\n\n        if \"digest\" in s_auth.lower() and self._thread_local.num_401_calls < 2:\n            self._thread_local.num_401_calls += 1\n            pat = re.compile(r\"digest \", flags=re.IGNORECASE)\n            self._thread_local.chal = parse_dict_header(pat.sub(\"\", s_auth, count=1))\n\n            # Consume content and release the original connection\n            # to allow our new request to reuse the same one.\n            r.content\n            r.close()\n            prep = r.request.copy()\n            extract_cookies_to_jar(prep._cookies, r.request, r.raw)\n            prep.prepare_cookies(prep._cookies)\n\n            prep.headers[\"Authorization\"] = self.build_digest_header(\n                prep.method, prep.url\n            )\n            _r = r.connection.send(prep, **kwargs)\n            _r.history.append(r)\n            _r.request = prep\n\n            return _r\n\n        self._thread_local.num_401_calls = 1\n        return r\n\n    def __call__(self, r):\n        # Initialize per-thread state, if needed\n        self.init_per_thread_state()\n        # If we have a saved nonce, skip the 401\n        if self._thread_local.last_nonce:\n            r.headers[\"Authorization\"] = self.build_digest_header(r.method, r.url)\n        try:\n            self._thread_local.pos = r.body.tell()\n        except AttributeError:\n            # In the case of HTTPDigestAuth being reused and the body of\n            # the previous request was a file-like object, pos has the\n            # file position of the previous body. Ensure it's set to\n            # None.\n            self._thread_local.pos = None\n        r.register_hook(\"response\", self.handle_401)\n        r.register_hook(\"response\", self.handle_redirect)\n        self._thread_local.num_401_calls = 1\n\n        return r\n\n    def __eq__(self, other):\n        return all(\n            [\n                self.username == getattr(other, \"username\", None),\n                self.password == getattr(other, \"password\", None),\n            ]\n        )\n\n    def __ne__(self, other):\n        return not self == other"}, {"id": "file::certs.py", "label": "certs.py", "title": "file::certs.py [Lsyn]", "type": "file", "layer": "Lsyn", "file": "certs.py", "line": 1, "shape": "dot", "color": {"background": "#ea580c", "border": "#ffffff"}, "size": 20, "docstring": "requests.certs\n~~~~~~~~~~~~~~\n\nThis module returns the preferred default CA certificate bundle. There is\nonly one \u2014 the one from the certifi package.\n\nIf you are packaging Requests, e.g., for a Linux distribution or a managed\nenvironment, you can change the definition of where() to return a separately\npackaged CA bundle.", "code": "# File: certs.py\n# Lines: 18"}, {"id": "file::compat.py", "label": "compat.py", "title": "file::compat.py [Lsyn]", "type": "file", "layer": "Lsyn", "file": "compat.py", "line": 1, "shape": "dot", "color": {"background": "#ea580c", "border": "#ffffff"}, "size": 20, "docstring": "requests.compat\n~~~~~~~~~~~~~~~\n\nThis module previously handled import compatibility issues\nbetween Python 2 and Python 3. It remains for backwards\ncompatibility until the next major version.", "code": "# File: compat.py\n# Lines: 106"}, {"id": "module::importlib", "label": "importlib", "title": "module::importlib [Ldep]", "type": "module", "layer": "Ldep", "file": "compat.py", "line": 0, "shape": "dot", "color": {"background": "#0891b2", "border": "#ffffff"}, "size": 18, "docstring": "", "code": ""}, {"id": "module::sys", "label": "sys", "title": "module::sys [Ldep]", "type": "module", "layer": "Ldep", "file": "compat.py", "line": 0, "shape": "dot", "color": {"background": "#0891b2", "border": "#ffffff"}, "size": 18, "docstring": "", "code": ""}, {"id": "module::simplejson", "label": "simplejson", "title": "module::simplejson [Ldep]", "type": "module", "layer": "Ldep", "file": "compat.py", "line": 0, "shape": "dot", "color": {"background": "#0891b2", "border": "#ffffff"}, "size": 18, "docstring": "", "code": ""}, {"id": "module::json", "label": "json", "title": "module::json [Ldep]", "type": "module", "layer": "Ldep", "file": "compat.py", "line": 0, "shape": "dot", "color": {"background": "#0891b2", "border": "#ffffff"}, "size": 18, "docstring": "", "code": ""}, {"id": "file::cookies.py", "label": "cookies.py", "title": "file::cookies.py [Lsyn]", "type": "file", "layer": "Lsyn", "file": "cookies.py", "line": 1, "shape": "dot", "color": {"background": "#ea580c", "border": "#ffffff"}, "size": 20, "docstring": "requests.cookies\n~~~~~~~~~~~~~~~~\n\nCompatibility code to be able to use `http.cookiejar.CookieJar` with requests.\n\nrequests.utils imports from here, so be careful with imports.", "code": "# File: cookies.py\n# Lines: 561"}, {"id": "module::calendar", "label": "calendar", "title": "module::calendar [Ldep]", "type": "module", "layer": "Ldep", "file": "cookies.py", "line": 0, "shape": "dot", "color": {"background": "#0891b2", "border": "#ffffff"}, "size": 18, "docstring": "", "code": ""}, {"id": "module::copy", "label": "copy", "title": "module::copy [Ldep]", "type": "module", "layer": "Ldep", "file": "cookies.py", "line": 0, "shape": "dot", "color": {"background": "#0891b2", "border": "#ffffff"}, "size": 18, "docstring": "", "code": ""}, {"id": "module::dummy_threading", "label": "dummy_threading", "title": "module::dummy_threading [Ldep]", "type": "module", "layer": "Ldep", "file": "cookies.py", "line": 0, "shape": "dot", "color": {"background": "#0891b2", "border": "#ffffff"}, "size": 18, "docstring": "", "code": ""}, {"id": "cookies.py:MockRequest", "label": "MockRequest", "title": "cookies.py:MockRequest [Lsyn]", "type": "class", "layer": "Lsyn", "file": "cookies.py", "line": 23, "shape": "dot", "color": {"background": "#16a34a", "border": "#ffffff"}, "size": 16, "docstring": "Wraps a `requests.Request` to mimic a `urllib2.Request`.\n\nThe code in `http.cookiejar.CookieJar` expects this interface in order to correctly\nmanage cookie policies, i.e., determine whether a cookie can be set, given the\ndomains of the request and the cookie.\n\nThe original request object is read-only. The client is responsible for collecting\nthe new headers via `get_new_headers()` and interpreting them appropriately. You\nprobably want `get_cookie_header`, defined below.", "code": "class MockRequest:\n    \"\"\"Wraps a `requests.Request` to mimic a `urllib2.Request`.\n\n    The code in `http.cookiejar.CookieJar` expects this interface in order to correctly\n    manage cookie policies, i.e., determine whether a cookie can be set, given the\n    domains of the request and the cookie.\n\n    The original request object is read-only. The client is responsible for collecting\n    the new headers via `get_new_headers()` and interpreting them appropriately. You\n    probably want `get_cookie_header`, defined below.\n    \"\"\"\n\n    def __init__(self, request):\n        self._r = request\n        self._new_headers = {}\n        self.type = urlparse(self._r.url).scheme\n\n    def get_type(self):\n        return self.type\n\n    def get_host(self):\n        return urlparse(self._r.url).netloc\n\n    def get_origin_req_host(self):\n        return self.get_host()\n\n    def get_full_url(self):\n        # Only return the response's URL if the user hadn't set the Host\n        # header\n        if not self._r.headers.get(\"Host\"):\n            return self._r.url\n        # If they did set it, retrieve it and reconstruct the expected domain\n        host = to_native_string(self._r.headers[\"Host\"], encoding=\"utf-8\")\n        parsed = urlparse(self._r.url)\n        # Reconstruct the URL as we expect it\n        return urlunparse(\n            [\n                parsed.scheme,\n                host,\n                parsed.path,\n                parsed.params,\n                parsed.query,\n                parsed.fragment,\n            ]\n        )\n\n    def is_unverifiable(self):\n        return True\n\n    def has_header(self, name):\n        return name in self._r.headers or name in self._new_headers\n\n    def get_header(self, name, default=None):\n        return self._r.headers.get(name, self._new_headers.get(name, default))\n\n    def add_header(self, key, val):\n        \"\"\"cookiejar has no legitimate use for this method; add it back if you find one.\"\"\"\n        raise NotImplementedError(\n            \"Cookie headers should be added with add_unredirected_header()\"\n        )\n\n    def add_unredirected_header(self, name, value):\n        self._new_headers[name] = value\n\n    def get_new_headers(self):\n        return self._new_headers\n\n    @property\n    def unverifiable(self):\n        return self.is_unverifiable()\n\n    @property\n    def origin_req_host(self):\n        return self.get_origin_req_host()\n\n    @property\n    def host(self):\n        return self.get_host()"}, {"id": "cookies.py:MockResponse", "label": "MockResponse", "title": "cookies.py:MockResponse [Lsyn]", "type": "class", "layer": "Lsyn", "file": "cookies.py", "line": 103, "shape": "dot", "color": {"background": "#16a34a", "border": "#ffffff"}, "size": 16, "docstring": "Wraps a `httplib.HTTPMessage` to mimic a `urllib.addinfourl`.\n\n...what? Basically, expose the parsed HTTP headers from the server response\nthe way `http.cookiejar` expects to see them.", "code": "class MockResponse:\n    \"\"\"Wraps a `httplib.HTTPMessage` to mimic a `urllib.addinfourl`.\n\n    ...what? Basically, expose the parsed HTTP headers from the server response\n    the way `http.cookiejar` expects to see them.\n    \"\"\"\n\n    def __init__(self, headers):\n        \"\"\"Make a MockResponse for `cookiejar` to read.\n\n        :param headers: a httplib.HTTPMessage or analogous carrying the headers\n        \"\"\"\n        self._headers = headers\n\n    def info(self):\n        return self._headers\n\n    def getheaders(self, name):\n        self._headers.getheaders(name)"}, {"id": "cookies.py:CookieConflictError", "label": "CookieConflictError", "title": "cookies.py:CookieConflictError [Lsyn]", "type": "class", "layer": "Lsyn", "file": "cookies.py", "line": 170, "shape": "dot", "color": {"background": "#16a34a", "border": "#ffffff"}, "size": 16, "docstring": "There are two cookies that meet the criteria specified in the cookie jar.\nUse .get and .set and include domain and path args in order to be more specific.", "code": "class CookieConflictError(RuntimeError):\n    \"\"\"There are two cookies that meet the criteria specified in the cookie jar.\n    Use .get and .set and include domain and path args in order to be more specific.\n    \"\"\""}, {"id": "cookies.py:RequestsCookieJar", "label": "RequestsCookieJar", "title": "cookies.py:RequestsCookieJar [Lsyn]", "type": "class", "layer": "Lsyn", "file": "cookies.py", "line": 176, "shape": "dot", "color": {"background": "#16a34a", "border": "#ffffff"}, "size": 16, "docstring": "Compatibility class; is a http.cookiejar.CookieJar, but exposes a dict\ninterface.\n\nThis is the CookieJar we create by default for requests and sessions that\ndon't specify one, since some clients may expect response.cookies and\nsession.cookies to support dict operations.\n\nRequests does not use the dict interface internally; it's just for\ncompatibility with external client code. All requests code should work\nout of the box with externally provided instances of ``CookieJar``, e.g.\n``LWPCookieJar`` and ``FileCookieJar``.\n\nUnlike a regular CookieJar, this class is pickleable.\n\n.. warning:: dictionary operations that are normally O(1) may be O(n).", "code": "class RequestsCookieJar(cookielib.CookieJar, MutableMapping):\n    \"\"\"Compatibility class; is a http.cookiejar.CookieJar, but exposes a dict\n    interface.\n\n    This is the CookieJar we create by default for requests and sessions that\n    don't specify one, since some clients may expect response.cookies and\n    session.cookies to support dict operations.\n\n    Requests does not use the dict interface internally; it's just for\n    compatibility with external client code. All requests code should work\n    out of the box with externally provided instances of ``CookieJar``, e.g.\n    ``LWPCookieJar`` and ``FileCookieJar``.\n\n    Unlike a regular CookieJar, this class is pickleable.\n\n    .. warning:: dictionary operations that are normally O(1) may be O(n).\n    \"\"\"\n\n    def get(self, name, default=None, domain=None, path=None):\n        \"\"\"Dict-like get() that also supports optional domain and path args in\n        order to resolve naming collisions from using one cookie jar over\n        multiple domains.\n\n        .. warning:: operation is O(n), not O(1).\n        \"\"\"\n        try:\n            return self._find_no_duplicates(name, domain, path)\n        except KeyError:\n            return default\n\n    def set(self, name, value, **kwargs):\n        \"\"\"Dict-like set() that also supports optional domain and path args in\n        order to resolve naming collisions from using one cookie jar over\n        multiple domains.\n        \"\"\"\n        # support client code that unsets cookies by assignment of a None value:\n        if value is None:\n            remove_cookie_by_name(\n                self, name, domain=kwargs.get(\"domain\"), path=kwargs.get(\"path\")\n            )\n            return\n\n        if isinstance(value, Morsel):\n            c = morsel_to_cookie(value)\n        else:\n            c = create_cookie(name, value, **kwargs)\n        self.set_cookie(c)\n        return c\n\n    def iterkeys(self):\n        \"\"\"Dict-like iterkeys() that returns an iterator of names of cookies\n        from the jar.\n\n        .. seealso:: itervalues() and iteritems().\n        \"\"\"\n        for cookie in iter(self):\n            yield cookie.name\n\n    def keys(self):\n        \"\"\"Dict-like keys() that returns a list of names of cookies from the\n        jar.\n\n        .. seealso:: values() and items().\n        \"\"\"\n        return list(self.iterkeys())\n\n    def itervalues(self):\n        \"\"\"Dict-like itervalues() that returns an iterator of values of cookies\n        from the jar.\n\n        .. seealso:: iterkeys() and iteritems().\n        \"\"\"\n        for cookie in iter(self):\n            yield cookie.value\n\n    def values(self):\n        \"\"\"Dict-like values() that returns a list of values of cookies from the\n        jar.\n\n        .. seealso:: keys() and items().\n        \"\"\"\n        return list(self.itervalues())\n\n    def iteritems(self):\n        \"\"\"Dict-like iteritems() that returns an iterator of name-value tuples\n        from the jar.\n\n        .. seealso:: iterkeys() and itervalues().\n        \"\"\"\n        for cookie in iter(self):\n            yield cookie.name, cookie.value\n\n    def items(self):\n        \"\"\"Dict-like items() that returns a list of name-value tuples from the\n        jar. Allows client-code to call ``dict(RequestsCookieJar)`` and get a\n        vanilla python dict of key value pairs.\n\n        .. seealso:: keys() and values().\n        \"\"\"\n        return list(self.iteritems())\n\n    def list_domains(self):\n        \"\"\"Utility method to list all the domains in the jar.\"\"\"\n        domains = []\n        for cookie in iter(self):\n            if cookie.domain not in domains:\n                domains.append(cookie.domain)\n        return domains\n\n    def list_paths(self):\n        \"\"\"Utility method to list all the paths in the jar.\"\"\"\n        paths = []\n        for cookie in iter(self):\n            if cookie.path not in paths:\n                paths.append(cookie.path)\n        return paths\n\n    def multiple_domains(self):\n        \"\"\"Returns True if there are multiple domains in the jar.\n        Returns False otherwise.\n\n        :rtype: bool\n        \"\"\"\n        domains = []\n        for cookie in iter(self):\n            if cookie.domain is not None and cookie.domain in domains:\n                return True\n            domains.append(cookie.domain)\n        return False  # there is only one domain in jar\n\n    def get_dict(self, domain=None, path=None):\n        \"\"\"Takes as an argument an optional domain and path and returns a plain\n        old Python dict of name-value pairs of cookies that meet the\n        requirements.\n\n        :rtype: dict\n        \"\"\"\n        dictionary = {}\n        for cookie in iter(self):\n            if (domain is None or cookie.domain == domain) and (\n                path is None or cookie.path == path\n            ):\n                dictionary[cookie.name] = cookie.value\n        return dictionary\n\n    def __contains__(self, name):\n        try:\n            return super().__contains__(name)\n        except CookieConflictError:\n            return True\n\n    def __getitem__(self, name):\n        \"\"\"Dict-like __getitem__() for compatibility with client code. Throws\n        exception if there are more than one cookie with name. In that case,\n        use the more explicit get() method instead.\n\n        .. warning:: operation is O(n), not O(1).\n        \"\"\"\n        return self._find_no_duplicates(name)\n\n    def __setitem__(self, name, value):\n        \"\"\"Dict-like __setitem__ for compatibility with client code. Throws\n        exception if there is already a cookie of that name in the jar. In that\n        case, use the more explicit set() method instead.\n        \"\"\"\n        self.set(name, value)\n\n    def __delitem__(self, name):\n        \"\"\"Deletes a cookie given a name. Wraps ``http.cookiejar.CookieJar``'s\n        ``remove_cookie_by_name()``.\n        \"\"\"\n        remove_cookie_by_name(self, name)\n\n    def set_cookie(self, cookie, *args, **kwargs):\n        if (\n            hasattr(cookie.value, \"startswith\")\n            and cookie.value.startswith('\"')\n            and cookie.value.endswith('\"')\n        ):\n            cookie.value = cookie.value.replace('\\\\\"', \"\")\n        return super().set_cookie(cookie, *args, **kwargs)\n\n    def update(self, other):\n        \"\"\"Updates this jar with cookies from another CookieJar or dict-like\"\"\"\n        if isinstance(other, cookielib.CookieJar):\n            for cookie in other:\n                self.set_cookie(copy.copy(cookie))\n        else:\n            super().update(other)\n\n    def _find(self, name, domain=None, path=None):\n        \"\"\"Requests uses this method internally to get cookie values.\n\n        If there are conflicting cookies, _find arbitrarily chooses one.\n        See _find_no_duplicates if you want an exception thrown if there are\n        conflicting cookies.\n\n        :param name: a string containing name of cookie\n        :param domain: (optional) string containing domain of cookie\n        :param path: (optional) string containing path of cookie\n        :return: cookie.value\n        \"\"\"\n        for cookie in iter(self):\n            if cookie.name == name:\n                if domain is None or cookie.domain == domain:\n                    if path is None or cookie.path == path:\n                        return cookie.value\n\n        raise KeyError(f\"name={name!r}, domain={domain!r}, path={path!r}\")\n\n    def _find_no_duplicates(self, name, domain=None, path=None):\n        \"\"\"Both ``__get_item__`` and ``get`` call this function: it's never\n        used elsewhere in Requests.\n\n        :param name: a string containing name of cookie\n        :param domain: (optional) string containing domain of cookie\n        :param path: (optional) string containing path of cookie\n        :raises KeyError: if cookie is not found\n        :raises CookieConflictError: if there are multiple cookies\n            that match name and optionally domain and path\n        :return: cookie.value\n        \"\"\"\n        toReturn = None\n        for cookie in iter(self):\n            if cookie.name == name:\n                if domain is None or cookie.domain == domain:\n                    if path is None or cookie.path == path:\n                        if toReturn is not None:\n                            # if there are multiple cookies that meet passed in criteria\n                            raise CookieConflictError(\n                                f\"There are multiple cookies with name, {name!r}\"\n                            )\n                        # we will eventually return this as long as no cookie conflict\n                        toReturn = cookie.value\n\n        if toReturn:\n            return toReturn\n        raise KeyError(f\"name={name!r}, domain={domain!r}, path={path!r}\")\n\n    def __getstate__(self):\n        \"\"\"Unlike a normal CookieJar, this class is pickleable.\"\"\"\n        state = self.__dict__.copy()\n        # remove the unpickleable RLock object\n        state.pop(\"_cookies_lock\")\n        return state\n\n    def __setstate__(self, state):\n        \"\"\"Unlike a normal CookieJar, this class is pickleable.\"\"\"\n        self.__dict__.update(state)\n        if \"_cookies_lock\" not in self.__dict__:\n            self._cookies_lock = threading.RLock()\n\n    def copy(self):\n        \"\"\"Return a copy of this RequestsCookieJar.\"\"\"\n        new_cj = RequestsCookieJar()\n        new_cj.set_policy(self.get_policy())\n        new_cj.update(self)\n        return new_cj\n\n    def get_policy(self):\n        \"\"\"Return the CookiePolicy instance used.\"\"\"\n        return self._policy"}, {"id": "file::exceptions.py", "label": "exceptions.py", "title": "file::exceptions.py [Lsyn]", "type": "file", "layer": "Lsyn", "file": "exceptions.py", "line": 1, "shape": "dot", "color": {"background": "#ea580c", "border": "#ffffff"}, "size": 20, "docstring": "requests.exceptions\n~~~~~~~~~~~~~~~~~~~\n\nThis module contains the set of Requests' exceptions.", "code": "# File: exceptions.py\n# Lines: 152"}, {"id": "exceptions.py:RequestException", "label": "RequestException", "title": "exceptions.py:RequestException [Lsyn]", "type": "class", "layer": "Lsyn", "file": "exceptions.py", "line": 13, "shape": "dot", "color": {"background": "#16a34a", "border": "#ffffff"}, "size": 16, "docstring": "There was an ambiguous exception that occurred while handling your\nrequest.", "code": "class RequestException(IOError):\n    \"\"\"There was an ambiguous exception that occurred while handling your\n    request.\n    \"\"\"\n\n    def __init__(self, *args, **kwargs):\n        \"\"\"Initialize RequestException with `request` and `response` objects.\"\"\"\n        response = kwargs.pop(\"response\", None)\n        self.response = response\n        self.request = kwargs.pop(\"request\", None)\n        if response is not None and not self.request and hasattr(response, \"request\"):\n            self.request = self.response.request\n        super().__init__(*args, **kwargs)"}, {"id": "exceptions.py:InvalidJSONError", "label": "InvalidJSONError", "title": "exceptions.py:InvalidJSONError [Lsyn]", "type": "class", "layer": "Lsyn", "file": "exceptions.py", "line": 28, "shape": "dot", "color": {"background": "#16a34a", "border": "#ffffff"}, "size": 16, "docstring": "A JSON error occurred.", "code": "class InvalidJSONError(RequestException):\n    \"\"\"A JSON error occurred.\"\"\""}, {"id": "exceptions.py:JSONDecodeError", "label": "JSONDecodeError", "title": "exceptions.py:JSONDecodeError [Lsyn]", "type": "class", "layer": "Lsyn", "file": "exceptions.py", "line": 32, "shape": "dot", "color": {"background": "#16a34a", "border": "#ffffff"}, "size": 16, "docstring": "Couldn't decode the text into json", "code": "class JSONDecodeError(InvalidJSONError, CompatJSONDecodeError):\n    \"\"\"Couldn't decode the text into json\"\"\"\n\n    def __init__(self, *args, **kwargs):\n        \"\"\"\n        Construct the JSONDecodeError instance first with all\n        args. Then use it's args to construct the IOError so that\n        the json specific args aren't used as IOError specific args\n        and the error message from JSONDecodeError is preserved.\n        \"\"\"\n        CompatJSONDecodeError.__init__(self, *args)\n        InvalidJSONError.__init__(self, *self.args, **kwargs)\n\n    def __reduce__(self):\n        \"\"\"\n        The __reduce__ method called when pickling the object must\n        be the one from the JSONDecodeError (be it json/simplejson)\n        as it expects all the arguments for instantiation, not just\n        one like the IOError, and the MRO would by default call the\n        __reduce__ method from the IOError due to the inheritance order.\n        \"\"\"\n        return CompatJSONDecodeError.__reduce__(self)"}, {"id": "exceptions.py:HTTPError", "label": "HTTPError", "title": "exceptions.py:HTTPError [Lsyn]", "type": "class", "layer": "Lsyn", "file": "exceptions.py", "line": 56, "shape": "dot", "color": {"background": "#16a34a", "border": "#ffffff"}, "size": 16, "docstring": "An HTTP error occurred.", "code": "class HTTPError(RequestException):\n    \"\"\"An HTTP error occurred.\"\"\""}, {"id": "exceptions.py:ConnectionError", "label": "ConnectionError", "title": "exceptions.py:ConnectionError [Lsyn]", "type": "class", "layer": "Lsyn", "file": "exceptions.py", "line": 60, "shape": "dot", "color": {"background": "#16a34a", "border": "#ffffff"}, "size": 16, "docstring": "A Connection error occurred.", "code": "class ConnectionError(RequestException):\n    \"\"\"A Connection error occurred.\"\"\""}, {"id": "exceptions.py:ProxyError", "label": "ProxyError", "title": "exceptions.py:ProxyError [Lsyn]", "type": "class", "layer": "Lsyn", "file": "exceptions.py", "line": 64, "shape": "dot", "color": {"background": "#16a34a", "border": "#ffffff"}, "size": 16, "docstring": "A proxy error occurred.", "code": "class ProxyError(ConnectionError):\n    \"\"\"A proxy error occurred.\"\"\""}, {"id": "exceptions.py:SSLError", "label": "SSLError", "title": "exceptions.py:SSLError [Lsyn]", "type": "class", "layer": "Lsyn", "file": "exceptions.py", "line": 68, "shape": "dot", "color": {"background": "#16a34a", "border": "#ffffff"}, "size": 16, "docstring": "An SSL error occurred.", "code": "class SSLError(ConnectionError):\n    \"\"\"An SSL error occurred.\"\"\""}, {"id": "exceptions.py:Timeout", "label": "Timeout", "title": "exceptions.py:Timeout [Lsyn]", "type": "class", "layer": "Lsyn", "file": "exceptions.py", "line": 72, "shape": "dot", "color": {"background": "#16a34a", "border": "#ffffff"}, "size": 16, "docstring": "The request timed out.\n\nCatching this error will catch both\n:exc:`~requests.exceptions.ConnectTimeout` and\n:exc:`~requests.exceptions.ReadTimeout` errors.", "code": "class Timeout(RequestException):\n    \"\"\"The request timed out.\n\n    Catching this error will catch both\n    :exc:`~requests.exceptions.ConnectTimeout` and\n    :exc:`~requests.exceptions.ReadTimeout` errors.\n    \"\"\""}, {"id": "exceptions.py:ConnectTimeout", "label": "ConnectTimeout", "title": "exceptions.py:ConnectTimeout [Lsyn]", "type": "class", "layer": "Lsyn", "file": "exceptions.py", "line": 81, "shape": "dot", "color": {"background": "#16a34a", "border": "#ffffff"}, "size": 16, "docstring": "The request timed out while trying to connect to the remote server.\n\nRequests that produced this error are safe to retry.", "code": "class ConnectTimeout(ConnectionError, Timeout):\n    \"\"\"The request timed out while trying to connect to the remote server.\n\n    Requests that produced this error are safe to retry.\n    \"\"\""}, {"id": "exceptions.py:ReadTimeout", "label": "ReadTimeout", "title": "exceptions.py:ReadTimeout [Lsyn]", "type": "class", "layer": "Lsyn", "file": "exceptions.py", "line": 88, "shape": "dot", "color": {"background": "#16a34a", "border": "#ffffff"}, "size": 16, "docstring": "The server did not send any data in the allotted amount of time.", "code": "class ReadTimeout(Timeout):\n    \"\"\"The server did not send any data in the allotted amount of time.\"\"\""}, {"id": "exceptions.py:URLRequired", "label": "URLRequired", "title": "exceptions.py:URLRequired [Lsyn]", "type": "class", "layer": "Lsyn", "file": "exceptions.py", "line": 92, "shape": "dot", "color": {"background": "#16a34a", "border": "#ffffff"}, "size": 16, "docstring": "A valid URL is required to make a request.", "code": "class URLRequired(RequestException):\n    \"\"\"A valid URL is required to make a request.\"\"\""}, {"id": "exceptions.py:TooManyRedirects", "label": "TooManyRedirects", "title": "exceptions.py:TooManyRedirects [Lsyn]", "type": "class", "layer": "Lsyn", "file": "exceptions.py", "line": 96, "shape": "dot", "color": {"background": "#16a34a", "border": "#ffffff"}, "size": 16, "docstring": "Too many redirects.", "code": "class TooManyRedirects(RequestException):\n    \"\"\"Too many redirects.\"\"\""}, {"id": "exceptions.py:MissingSchema", "label": "MissingSchema", "title": "exceptions.py:MissingSchema [Lsyn]", "type": "class", "layer": "Lsyn", "file": "exceptions.py", "line": 100, "shape": "dot", "color": {"background": "#16a34a", "border": "#ffffff"}, "size": 16, "docstring": "The URL scheme (e.g. http or https) is missing.", "code": "class MissingSchema(RequestException, ValueError):\n    \"\"\"The URL scheme (e.g. http or https) is missing.\"\"\""}, {"id": "exceptions.py:InvalidSchema", "label": "InvalidSchema", "title": "exceptions.py:InvalidSchema [Lsyn]", "type": "class", "layer": "Lsyn", "file": "exceptions.py", "line": 104, "shape": "dot", "color": {"background": "#16a34a", "border": "#ffffff"}, "size": 16, "docstring": "The URL scheme provided is either invalid or unsupported.", "code": "class InvalidSchema(RequestException, ValueError):\n    \"\"\"The URL scheme provided is either invalid or unsupported.\"\"\""}, {"id": "exceptions.py:InvalidURL", "label": "InvalidURL", "title": "exceptions.py:InvalidURL [Lsyn]", "type": "class", "layer": "Lsyn", "file": "exceptions.py", "line": 108, "shape": "dot", "color": {"background": "#16a34a", "border": "#ffffff"}, "size": 16, "docstring": "The URL provided was somehow invalid.", "code": "class InvalidURL(RequestException, ValueError):\n    \"\"\"The URL provided was somehow invalid.\"\"\""}, {"id": "exceptions.py:InvalidHeader", "label": "InvalidHeader", "title": "exceptions.py:InvalidHeader [Lsyn]", "type": "class", "layer": "Lsyn", "file": "exceptions.py", "line": 112, "shape": "dot", "color": {"background": "#16a34a", "border": "#ffffff"}, "size": 16, "docstring": "The header value provided was somehow invalid.", "code": "class InvalidHeader(RequestException, ValueError):\n    \"\"\"The header value provided was somehow invalid.\"\"\""}, {"id": "exceptions.py:InvalidProxyURL", "label": "InvalidProxyURL", "title": "exceptions.py:InvalidProxyURL [Lsyn]", "type": "class", "layer": "Lsyn", "file": "exceptions.py", "line": 116, "shape": "dot", "color": {"background": "#16a34a", "border": "#ffffff"}, "size": 16, "docstring": "The proxy URL provided is invalid.", "code": "class InvalidProxyURL(InvalidURL):\n    \"\"\"The proxy URL provided is invalid.\"\"\""}, {"id": "exceptions.py:ChunkedEncodingError", "label": "ChunkedEncodingError", "title": "exceptions.py:ChunkedEncodingError [Lsyn]", "type": "class", "layer": "Lsyn", "file": "exceptions.py", "line": 120, "shape": "dot", "color": {"background": "#16a34a", "border": "#ffffff"}, "size": 16, "docstring": "The server declared chunked encoding but sent an invalid chunk.", "code": "class ChunkedEncodingError(RequestException):\n    \"\"\"The server declared chunked encoding but sent an invalid chunk.\"\"\""}, {"id": "exceptions.py:ContentDecodingError", "label": "ContentDecodingError", "title": "exceptions.py:ContentDecodingError [Lsyn]", "type": "class", "layer": "Lsyn", "file": "exceptions.py", "line": 124, "shape": "dot", "color": {"background": "#16a34a", "border": "#ffffff"}, "size": 16, "docstring": "Failed to decode response content.", "code": "class ContentDecodingError(RequestException, BaseHTTPError):\n    \"\"\"Failed to decode response content.\"\"\""}, {"id": "exceptions.py:StreamConsumedError", "label": "StreamConsumedError", "title": "exceptions.py:StreamConsumedError [Lsyn]", "type": "class", "layer": "Lsyn", "file": "exceptions.py", "line": 128, "shape": "dot", "color": {"background": "#16a34a", "border": "#ffffff"}, "size": 16, "docstring": "The content for this response was already consumed.", "code": "class StreamConsumedError(RequestException, TypeError):\n    \"\"\"The content for this response was already consumed.\"\"\""}, {"id": "exceptions.py:RetryError", "label": "RetryError", "title": "exceptions.py:RetryError [Lsyn]", "type": "class", "layer": "Lsyn", "file": "exceptions.py", "line": 132, "shape": "dot", "color": {"background": "#16a34a", "border": "#ffffff"}, "size": 16, "docstring": "Custom retries logic failed", "code": "class RetryError(RequestException):\n    \"\"\"Custom retries logic failed\"\"\""}, {"id": "exceptions.py:UnrewindableBodyError", "label": "UnrewindableBodyError", "title": "exceptions.py:UnrewindableBodyError [Lsyn]", "type": "class", "layer": "Lsyn", "file": "exceptions.py", "line": 136, "shape": "dot", "color": {"background": "#16a34a", "border": "#ffffff"}, "size": 16, "docstring": "Requests encountered an error when trying to rewind a body.", "code": "class UnrewindableBodyError(RequestException):\n    \"\"\"Requests encountered an error when trying to rewind a body.\"\"\""}, {"id": "exceptions.py:RequestsWarning", "label": "RequestsWarning", "title": "exceptions.py:RequestsWarning [Lsyn]", "type": "class", "layer": "Lsyn", "file": "exceptions.py", "line": 143, "shape": "dot", "color": {"background": "#16a34a", "border": "#ffffff"}, "size": 16, "docstring": "Base warning for Requests.", "code": "class RequestsWarning(Warning):\n    \"\"\"Base warning for Requests.\"\"\""}, {"id": "exceptions.py:FileModeWarning", "label": "FileModeWarning", "title": "exceptions.py:FileModeWarning [Lsyn]", "type": "class", "layer": "Lsyn", "file": "exceptions.py", "line": 147, "shape": "dot", "color": {"background": "#16a34a", "border": "#ffffff"}, "size": 16, "docstring": "A file was opened in text mode, but Requests determined its binary length.", "code": "class FileModeWarning(RequestsWarning, DeprecationWarning):\n    \"\"\"A file was opened in text mode, but Requests determined its binary length.\"\"\""}, {"id": "exceptions.py:RequestsDependencyWarning", "label": "RequestsDependencyWarning", "title": "exceptions.py:RequestsDependencyWarning [Lsyn]", "type": "class", "layer": "Lsyn", "file": "exceptions.py", "line": 151, "shape": "dot", "color": {"background": "#16a34a", "border": "#ffffff"}, "size": 16, "docstring": "An imported dependency doesn't match the expected version range.", "code": "class RequestsDependencyWarning(RequestsWarning):\n    \"\"\"An imported dependency doesn't match the expected version range.\"\"\""}, {"id": "file::help.py", "label": "help.py", "title": "file::help.py [Lsyn]", "type": "file", "layer": "Lsyn", "file": "help.py", "line": 1, "shape": "dot", "color": {"background": "#ea580c", "border": "#ffffff"}, "size": 20, "docstring": "Module containing bug report helper(s).", "code": "# File: help.py\n# Lines: 131"}, {"id": "module::platform", "label": "platform", "title": "module::platform [Ldep]", "type": "module", "layer": "Ldep", "file": "help.py", "line": 0, "shape": "dot", "color": {"background": "#0891b2", "border": "#ffffff"}, "size": 18, "docstring": "", "code": ""}, {"id": "module::idna", "label": "idna", "title": "module::idna [Ldep]", "type": "module", "layer": "Ldep", "file": "help.py", "line": 0, "shape": "dot", "color": {"background": "#0891b2", "border": "#ffffff"}, "size": 18, "docstring": "", "code": ""}, {"id": "module::charset_normalizer", "label": "charset_normalizer", "title": "module::charset_normalizer [Ldep]", "type": "module", "layer": "Ldep", "file": "help.py", "line": 0, "shape": "dot", "color": {"background": "#0891b2", "border": "#ffffff"}, "size": 18, "docstring": "", "code": ""}, {"id": "module::chardet", "label": "chardet", "title": "module::chardet [Ldep]", "type": "module", "layer": "Ldep", "file": "help.py", "line": 0, "shape": "dot", "color": {"background": "#0891b2", "border": "#ffffff"}, "size": 18, "docstring": "", "code": ""}, {"id": "module::cryptography", "label": "cryptography", "title": "module::cryptography [Ldep]", "type": "module", "layer": "Ldep", "file": "help.py", "line": 0, "shape": "dot", "color": {"background": "#0891b2", "border": "#ffffff"}, "size": 18, "docstring": "", "code": ""}, {"id": "module::OpenSSL", "label": "OpenSSL", "title": "module::OpenSSL [Ldep]", "type": "module", "layer": "Ldep", "file": "help.py", "line": 0, "shape": "dot", "color": {"background": "#0891b2", "border": "#ffffff"}, "size": 18, "docstring": "", "code": ""}, {"id": "file::hooks.py", "label": "hooks.py", "title": "file::hooks.py [Lsyn]", "type": "file", "layer": "Lsyn", "file": "hooks.py", "line": 1, "shape": "dot", "color": {"background": "#ea580c", "border": "#ffffff"}, "size": 20, "docstring": "requests.hooks\n~~~~~~~~~~~~~~\n\nThis module provides the capabilities for the Requests hooks system.\n\nAvailable hooks:\n\n``response``:\n    The response generated from a Request.", "code": "# File: hooks.py\n# Lines: 34"}, {"id": "file::models.py", "label": "models.py", "title": "file::models.py [Lsyn]", "type": "file", "layer": "Lsyn", "file": "models.py", "line": 1, "shape": "dot", "color": {"background": "#ea580c", "border": "#ffffff"}, "size": 20, "docstring": "requests.models\n~~~~~~~~~~~~~~~\n\nThis module contains the primary objects that power Requests.", "code": "# File: models.py\n# Lines: 1041"}, {"id": "module::datetime", "label": "datetime", "title": "module::datetime [Ldep]", "type": "module", "layer": "Ldep", "file": "models.py", "line": 0, "shape": "dot", "color": {"background": "#0891b2", "border": "#ffffff"}, "size": 18, "docstring": "", "code": ""}, {"id": "module::encodings.idna", "label": "encodings.idna", "title": "module::encodings.idna [Ldep]", "type": "module", "layer": "Ldep", "file": "models.py", "line": 0, "shape": "dot", "color": {"background": "#0891b2", "border": "#ffffff"}, "size": 18, "docstring": "", "code": ""}, {"id": "models.py:RequestEncodingMixin", "label": "RequestEncodingMixin", "title": "models.py:RequestEncodingMixin [Lsyn]", "type": "class", "layer": "Lsyn", "file": "models.py", "line": 86, "shape": "dot", "color": {"background": "#16a34a", "border": "#ffffff"}, "size": 16, "docstring": "", "code": "class RequestEncodingMixin:\n    @property\n    def path_url(self):\n        \"\"\"Build the path URL to use.\"\"\"\n\n        url = []\n\n        p = urlsplit(self.url)\n\n        path = p.path\n        if not path:\n            path = \"/\"\n\n        url.append(path)\n\n        query = p.query\n        if query:\n            url.append(\"?\")\n            url.append(query)\n\n        return \"\".join(url)\n\n    @staticmethod\n    def _encode_params(data):\n        \"\"\"Encode parameters in a piece of data.\n\n        Will successfully encode parameters when passed as a dict or a list of\n        2-tuples. Order is retained if data is a list of 2-tuples but arbitrary\n        if parameters are supplied as a dict.\n        \"\"\"\n\n        if isinstance(data, (str, bytes)):\n            return data\n        elif hasattr(data, \"read\"):\n            return data\n        elif hasattr(data, \"__iter__\"):\n            result = []\n            for k, vs in to_key_val_list(data):\n                if isinstance(vs, basestring) or not hasattr(vs, \"__iter__\"):\n                    vs = [vs]\n                for v in vs:\n                    if v is not None:\n                        result.append(\n                            (\n                                k.encode(\"utf-8\") if isinstance(k, str) else k,\n                                v.encode(\"utf-8\") if isinstance(v, str) else v,\n                            )\n                        )\n            return urlencode(result, doseq=True)\n        else:\n            return data\n\n    @staticmethod\n    def _encode_files(files, data):\n        \"\"\"Build the body for a multipart/form-data request.\n\n        Will
