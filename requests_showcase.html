ause when request_hooks == {'response': []}, the\nmerge breaks Session hooks entirely.", "code": "def merge_hooks(request_hooks, session_hooks, dict_class=OrderedDict):\n    \"\"\"Properly merges both requests and session hooks.\n\n    This is necessary because when request_hooks == {'response': []}, the\n    merge breaks Session hooks entirely.\n    \"\"\"\n    if session_hooks is None or session_hooks.get(\"response\") == []:\n        return request_hooks\n\n    if request_hooks is None or request_hooks.get(\"response\") == []:\n        return session_hooks\n\n    return merge_setting(request_hooks, session_hooks, dict_class)"}, {"id": "utils.py:get_unicode_from_response", "label": "get_unicode_from_response", "title": "utils.py:get_unicode_from_response [Lsyn]", "type": "function", "layer": "Lsyn", "file": "utils.py", "line": 581, "shape": "dot", "color": {"background": "#2563eb", "border": "#ffffff"}, "size": 12, "docstring": "Returns the requested content back in unicode.\n\n:param r: Response object to get unicode content from.\n\nTried:\n\n1. charset from content-type\n2. fall back and replace all unicode characters\n\n:rtype: str", "code": "def get_unicode_from_response(r):\n    \"\"\"Returns the requested content back in unicode.\n\n    :param r: Response object to get unicode content from.\n\n    Tried:\n\n    1. charset from content-type\n    2. fall back and replace all unicode characters\n\n    :rtype: str\n    \"\"\"\n    warnings.warn(\n        (\n            \"In requests 3.0, get_unicode_from_response will be removed. For \"\n            \"more information, please see the discussion on issue #2266. (This\"\n            \" warning should only appear once.)\"\n        ),\n        DeprecationWarning,\n    )\n\n    tried_encodings = []\n\n    # Try charset from content-type\n    encoding = get_encoding_from_headers(r.headers)\n\n    if encoding:\n        try:\n            return str(r.content, encoding)\n        except UnicodeError:\n            tried_encodings.append(encoding)\n\n    # Fall back:\n    try:\n        return str(r.content, encoding, errors=\"replace\")\n    except TypeError:\n        return r.content"}, {"id": "cookies.py:RequestsCookieJar.items", "label": "items", "title": "cookies.py:RequestsCookieJar.items [Lsyn]", "type": "function", "layer": "Lsyn", "file": "cookies.py", "line": 268, "shape": "dot", "color": {"background": "#2563eb", "border": "#ffffff"}, "size": 12, "docstring": "Dict-like items() that returns a list of name-value tuples from the\njar. Allows client-code to call ``dict(RequestsCookieJar)`` and get a\nvanilla python dict of key value pairs.\n\n.. seealso:: keys() and values().", "code": "    def items(self):\n        \"\"\"Dict-like items() that returns a list of name-value tuples from the\n        jar. Allows client-code to call ``dict(RequestsCookieJar)`` and get a\n        vanilla python dict of key value pairs.\n\n        .. seealso:: keys() and values().\n        \"\"\"\n        return list(self.iteritems())"}, {"id": "cookies.py:RequestsCookieJar.get_dict", "label": "get_dict", "title": "cookies.py:RequestsCookieJar.get_dict [Lsyn]", "type": "function", "layer": "Lsyn", "file": "cookies.py", "line": 306, "shape": "dot", "color": {"background": "#2563eb", "border": "#ffffff"}, "size": 12, "docstring": "Takes as an argument an optional domain and path and returns a plain\nold Python dict of name-value pairs of cookies that meet the\nrequirements.\n\n:rtype: dict", "code": "    def get_dict(self, domain=None, path=None):\n        \"\"\"Takes as an argument an optional domain and path and returns a plain\n        old Python dict of name-value pairs of cookies that meet the\n        requirements.\n\n        :rtype: dict\n        \"\"\"\n        dictionary = {}\n        for cookie in iter(self):\n            if (domain is None or cookie.domain == domain) and (\n                path is None or cookie.path == path\n            ):\n                dictionary[cookie.name] = cookie.value\n        return dictionary"}, {"id": "models.py:PreparedRequest.prepare_headers", "label": "prepare_headers", "title": "models.py:PreparedRequest.prepare_headers [Lsyn]", "type": "function", "layer": "Lsyn", "file": "models.py", "line": 485, "shape": "dot", "color": {"background": "#2563eb", "border": "#ffffff"}, "size": 12, "docstring": "Prepares the given HTTP headers.", "code": "    def prepare_headers(self, headers):\n        \"\"\"Prepares the given HTTP headers.\"\"\"\n\n        self.headers = CaseInsensitiveDict()\n        if headers:\n            for header in headers.items():\n                # Raise exception on invalid header value.\n                check_header_validity(header)\n                name, value = header\n                self.headers[to_native_string(name)] = value"}, {"id": "sessions.py:Session.mount", "label": "mount", "title": "sessions.py:Session.mount [Lsyn]", "type": "function", "layer": "Lsyn", "file": "sessions.py", "line": 802, "shape": "dot", "color": {"background": "#2563eb", "border": "#ffffff"}, "size": 12, "docstring": "Registers a connection adapter to a prefix.\n\nAdapters are sorted in descending order by prefix length.", "code": "    def mount(self, prefix, adapter):\n        \"\"\"Registers a connection adapter to a prefix.\n\n        Adapters are sorted in descending order by prefix length.\n        \"\"\"\n        self.adapters[prefix] = adapter\n        keys_to_move = [k for k in self.adapters if len(k) < len(prefix)]\n\n        for key in keys_to_move:\n            self.adapters[key] = self.adapters.pop(key)"}, {"id": "utils.py:to_key_val_list", "label": "to_key_val_list", "title": "utils.py:to_key_val_list [Lsyn]", "type": "function", "layer": "Lsyn", "file": "utils.py", "line": 335, "shape": "dot", "color": {"background": "#2563eb", "border": "#ffffff"}, "size": 12, "docstring": "Take an object and test to see if it can be represented as a\ndictionary. If it can be, return a list of tuples, e.g.,\n\n::\n\n    >>> to_key_val_list([('key', 'val')])\n    [('key', 'val')]\n    >>> to_key_val_list({'key': 'val'})\n    [('key', 'val')]\n    >>> to_key_val_list('string')\n    Traceback (most recent call last):\n    ...\n    ValueError: cannot encode objects that are not 2-tuples\n\n:rtype: list", "code": "def to_key_val_list(value):\n    \"\"\"Take an object and test to see if it can be represented as a\n    dictionary. If it can be, return a list of tuples, e.g.,\n\n    ::\n\n        >>> to_key_val_list([('key', 'val')])\n        [('key', 'val')]\n        >>> to_key_val_list({'key': 'val'})\n        [('key', 'val')]\n        >>> to_key_val_list('string')\n        Traceback (most recent call last):\n        ...\n        ValueError: cannot encode objects that are not 2-tuples\n\n    :rtype: list\n    \"\"\"\n    if value is None:\n        return None\n\n    if isinstance(value, (str, bytes, bool, int)):\n        raise ValueError(\"cannot encode objects that are not 2-tuples\")\n\n    if isinstance(value, Mapping):\n        value = value.items()\n\n    return list(value)"}, {"id": "adapters.py:HTTPAdapter.__setstate__", "label": "__setstate__", "title": "adapters.py:HTTPAdapter.__setstate__ [Lsyn]", "type": "function", "layer": "Lsyn", "file": "adapters.py", "line": 204, "shape": "dot", "color": {"background": "#2563eb", "border": "#ffffff"}, "size": 12, "docstring": "", "code": "    def __setstate__(self, state):\n        # Can't handle by adding 'proxy_manager' to self.__attrs__ because\n        # self.poolmanager uses a lambda function, which isn't pickleable.\n        self.proxy_manager = {}\n        self.config = {}\n\n        for attr, value in state.items():\n            setattr(self, attr, value)\n\n        self.init_poolmanager(\n            self._pool_connections, self._pool_maxsize, block=self._pool_block\n        )"}, {"id": "models.py:Response.__init__", "label": "__init__", "title": "models.py:Response.__init__ [Lsyn]", "type": "function", "layer": "Lsyn", "file": "models.py", "line": 660, "shape": "dot", "color": {"background": "#2563eb", "border": "#ffffff"}, "size": 12, "docstring": "", "code": "    def __init__(self):\n        self._content = False\n        self._content_consumed = False\n        self._next = None\n\n        #: Integer Code of responded HTTP Status, e.g. 404 or 200.\n        self.status_code = None\n\n        #: Case-insensitive Dictionary of Response Headers.\n        #: For example, ``headers['content-encoding']`` will return the\n        #: value of a ``'Content-Encoding'`` response header.\n        self.headers = CaseInsensitiveDict()\n\n        #: File-like object representation of response (for advanced usage).\n        #: Use of ``raw`` requires that ``stream=True`` be set on the request.\n        #: This requirement does not apply for use internally to Requests.\n        self.raw = None\n\n        #: Final URL location of Response.\n        self.url = None\n\n        #: Encoding to decode with when accessing r.text.\n        self.encoding = None\n\n        #: A list of :class:`Response <Response>` objects from\n        #: the history of the Request. Any redirect responses will end\n        #: up here. The list is sorted from the oldest to the most recent request.\n        self.history = []\n\n        #: Textual reason of responded HTTP Status, e.g. \"Not Found\" or \"OK\".\n        self.reason = None\n\n        #: A CookieJar of Cookies the server sent back.\n        self.cookies = cookiejar_from_dict({})\n\n        #: The amount of time elapsed between sending the request\n        #: and the arrival of the response (as a timedelta).\n        #: This property specifically measures the time taken between sending\n        #: the first byte of the request and finishing parsing the headers. It\n        #: is therefore unaffected by consuming the response content or the\n        #: value of the ``stream`` keyword argument.\n        self.elapsed = datetime.timedelta(0)\n\n        #: The :class:`PreparedRequest <PreparedRequest>` object to which this\n        #: is a response.\n        self.request = None"}, {"id": "models.py:Response.text", "label": "text", "title": "models.py:Response.text [Lsyn]", "type": "function", "layer": "Lsyn", "file": "models.py", "line": 912, "shape": "dot", "color": {"background": "#2563eb", "border": "#ffffff"}, "size": 12, "docstring": "Content of the response, in unicode.\n\nIf Response.encoding is None, encoding will be guessed using\n``charset_normalizer`` or ``chardet``.\n\nThe encoding of the response content is determined based solely on HTTP\nheaders, following RFC 2616 to the letter. If you can take advantage of\nnon-HTTP knowledge to make a better guess at the encoding, you should\nset ``r.encoding`` appropriately before accessing this property.", "code": "    def text(self):\n        \"\"\"Content of the response, in unicode.\n\n        If Response.encoding is None, encoding will be guessed using\n        ``charset_normalizer`` or ``chardet``.\n\n        The encoding of the response content is determined based solely on HTTP\n        headers, following RFC 2616 to the letter. If you can take advantage of\n        non-HTTP knowledge to make a better guess at the encoding, you should\n        set ``r.encoding`` appropriately before accessing this property.\n        \"\"\"\n\n        # Try charset from content-type\n        content = None\n        encoding = self.encoding\n\n        if not self.content:\n            return \"\"\n\n        # Fallback to auto-detected encoding.\n        if self.encoding is None:\n            encoding = self.apparent_encoding\n\n        # Decode unicode from given encoding.\n        try:\n            content = str(self.content, encoding, errors=\"replace\")\n        except (LookupError, TypeError):\n            # A LookupError is raised if the encoding was not found which could\n            # indicate a misspelling or similar mistake.\n            #\n            # A TypeError can be raised if encoding is None\n            #\n            # So we try blindly encoding.\n            content = str(self.content, errors=\"replace\")\n\n        return content"}, {"id": "sessions.py:SessionRedirectMixin.rebuild_method", "label": "rebuild_method", "title": "sessions.py:SessionRedirectMixin.rebuild_method [Lsyn]", "type": "function", "layer": "Lsyn", "file": "sessions.py", "line": 334, "shape": "dot", "color": {"background": "#2563eb", "border": "#ffffff"}, "size": 12, "docstring": "When being redirected we may want to change the method of the request\nbased on certain specs or browser behavior.", "code": "    def rebuild_method(self, prepared_request, response):\n        \"\"\"When being redirected we may want to change the method of the request\n        based on certain specs or browser behavior.\n        \"\"\"\n        method = prepared_request.method\n\n        # https://tools.ietf.org/html/rfc7231#section-6.4.4\n        if response.status_code == codes.see_other and method != \"HEAD\":\n            method = \"GET\"\n\n        # Do what the browsers do, despite standards...\n        # First, turn 302s into GETs.\n        if response.status_code == codes.found and method != \"HEAD\":\n            method = \"GET\"\n\n        # Second, if a POST is responded to with a 301, turn it into a GET.\n        # This bizarre behaviour is explained in Issue 1704.\n        if response.status_code == codes.moved and method == \"POST\":\n            method = \"GET\"\n\n        prepared_request.method = method"}, {"id": "utils.py:unquote_header_value", "label": "unquote_header_value", "title": "utils.py:unquote_header_value [Lsyn]", "type": "function", "layer": "Lsyn", "file": "utils.py", "line": 432, "shape": "dot", "color": {"background": "#2563eb", "border": "#ffffff"}, "size": 12, "docstring": "Unquotes a header value.  (Reversal of :func:`quote_header_value`).\nThis does not use the real unquoting but what browsers are actually\nusing for quoting.\n\n:param value: the header value to unquote.\n:rtype: str", "code": "def unquote_header_value(value, is_filename=False):\n    r\"\"\"Unquotes a header value.  (Reversal of :func:`quote_header_value`).\n    This does not use the real unquoting but what browsers are actually\n    using for quoting.\n\n    :param value: the header value to unquote.\n    :rtype: str\n    \"\"\"\n    if value and value[0] == value[-1] == '\"':\n        # this is not the real unquoting, but fixing this so that the\n        # RFC is met will result in bugs with internet explorer and\n        # probably some other browsers as well.  IE for example is\n        # uploading files with \"C:\\foo\\bar.txt\" as filename\n        value = value[1:-1]\n\n        # if this is a filename and the starting characters look like\n        # a UNC path, then just return the value without quotes.  Using the\n        # replace sequence below on a UNC path has the effect of turning\n        # the leading double slash into a single slash and then\n        # _fix_ie_filename() doesn't work correctly.  See #458.\n        if not is_filename or value[:2] != \"\\\\\\\\\":\n            return value.replace(\"\\\\\\\\\", \"\\\\\").replace('\\\\\"', '\"')\n    return value"}, {"id": "utils.py:iter_slices", "label": "iter_slices", "title": "utils.py:iter_slices [Lsyn]", "type": "function", "layer": "Lsyn", "file": "utils.py", "line": 571, "shape": "dot", "color": {"background": "#2563eb", "border": "#ffffff"}, "size": 12, "docstring": "Iterate over slices of a string.", "code": "def iter_slices(string, slice_length):\n    \"\"\"Iterate over slices of a string.\"\"\"\n    pos = 0\n    if slice_length is None or slice_length <= 0:\n        slice_length = len(string)\n    while pos < len(string):\n        yield string[pos : pos + slice_length]\n        pos += slice_length"}, {"id": "utils.py:is_valid_cidr", "label": "is_valid_cidr", "title": "utils.py:is_valid_cidr [Lsyn]", "type": "function", "layer": "Lsyn", "file": "utils.py", "line": 709, "shape": "dot", "color": {"background": "#2563eb", "border": "#ffffff"}, "size": 12, "docstring": "Very simple check of the cidr format in no_proxy variable.\n\n:rtype: bool", "code": "def is_valid_cidr(string_network):\n    \"\"\"\n    Very simple check of the cidr format in no_proxy variable.\n\n    :rtype: bool\n    \"\"\"\n    if string_network.count(\"/\") == 1:\n        try:\n            mask = int(string_network.split(\"/\")[1])\n        except ValueError:\n            return False\n\n        if mask < 1 or mask > 32:\n            return False\n\n        try:\n            socket.inet_aton(string_network.split(\"/\")[0])\n        except OSError:\n            return False\n    else:\n        return False\n    return True"}, {"id": "cookies.py:RequestsCookieJar.get", "label": "get", "title": "cookies.py:RequestsCookieJar.get [Lsyn]", "type": "function", "layer": "Lsyn", "file": "cookies.py", "line": 194, "shape": "dot", "color": {"background": "#2563eb", "border": "#ffffff"}, "size": 12, "docstring": "Dict-like get() that also supports optional domain and path args in\norder to resolve naming collisions from using one cookie jar over\nmultiple domains.\n\n.. warning:: operation is O(n), not O(1).", "code": "    def get(self, name, default=None, domain=None, path=None):\n        \"\"\"Dict-like get() that also supports optional domain and path args in\n        order to resolve naming collisions from using one cookie jar over\n        multiple domains.\n\n        .. warning:: operation is O(n), not O(1).\n        \"\"\"\n        try:\n            return self._find_no_duplicates(name, domain, path)\n        except KeyError:\n            return default"}, {"id": "models.py:PreparedRequest.prepare_content_length", "label": "prepare_content_length", "title": "models.py:PreparedRequest.prepare_content_length [Lsyn]", "type": "function", "layer": "Lsyn", "file": "models.py", "line": 574, "shape": "dot", "color": {"background": "#2563eb", "border": "#ffffff"}, "size": 12, "docstring": "Prepare Content-Length header based on request method and body", "code": "    def prepare_content_length(self, body):\n        \"\"\"Prepare Content-Length header based on request method and body\"\"\"\n        if body is not None:\n            length = super_len(body)\n            if length:\n                # If length exists, set it. Otherwise, we fallback\n                # to Transfer-Encoding: chunked.\n                self.headers[\"Content-Length\"] = builtin_str(length)\n        elif (\n            self.method not in (\"GET\", \"HEAD\")\n            and self.headers.get(\"Content-Length\") is None\n        ):\n            # Set Content-Length to 0 for methods that can have a body\n            # but don't provide one. (i.e. not GET or HEAD)\n            self.headers[\"Content-Length\"] = \"0\""}, {"id": "sessions.py:Session.get_adapter", "label": "get_adapter", "title": "sessions.py:Session.get_adapter [Lsyn]", "type": "function", "layer": "Lsyn", "file": "sessions.py", "line": 784, "shape": "dot", "color": {"background": "#2563eb", "border": "#ffffff"}, "size": 12, "docstring": "Returns the appropriate connection adapter for the given URL.\n\n:rtype: requests.adapters.BaseAdapter", "code": "    def get_adapter(self, url):\n        \"\"\"\n        Returns the appropriate connection adapter for the given URL.\n\n        :rtype: requests.adapters.BaseAdapter\n        \"\"\"\n        for prefix, adapter in self.adapters.items():\n            if url.lower().startswith(prefix.lower()):\n                return adapter\n\n        # Nothing matches :-/\n        raise InvalidSchema(f\"No connection adapters were found for {url!r}\")"}, {"id": "utils.py:get_encodings_from_content", "label": "get_encodings_from_content", "title": "utils.py:get_encodings_from_content [Lsyn]", "type": "function", "layer": "Lsyn", "file": "utils.py", "line": 479, "shape": "dot", "color": {"background": "#2563eb", "border": "#ffffff"}, "size": 12, "docstring": "Returns encodings from given content string.\n\n:param content: bytestring to extract encodings from.", "code": "def get_encodings_from_content(content):\n    \"\"\"Returns encodings from given content string.\n\n    :param content: bytestring to extract encodings from.\n    \"\"\"\n    warnings.warn(\n        (\n            \"In requests 3.0, get_encodings_from_content will be removed. For \"\n            \"more information, please see the discussion on issue #2266. (This\"\n            \" warning should only appear once.)\"\n        ),\n        DeprecationWarning,\n    )\n\n    charset_re = re.compile(r'<meta.*?charset=[\"\\']*(.+?)[\"\\'>]', flags=re.I)\n    pragma_re = re.compile(r'<meta.*?content=[\"\\']*;?charset=(.+?)[\"\\'>]', flags=re.I)\n    xml_re = re.compile(r'^<\\?xml.*?encoding=[\"\\']*(.+?)[\"\\'>]')\n\n    return (\n        charset_re.findall(content)\n        + pragma_re.findall(content)\n        + xml_re.findall(content)\n    )"}, {"id": "utils.py:set_environ", "label": "set_environ", "title": "utils.py:set_environ [Lsyn]", "type": "function", "layer": "Lsyn", "file": "utils.py", "line": 734, "shape": "dot", "color": {"background": "#2563eb", "border": "#ffffff"}, "size": 12, "docstring": "Set the environment variable 'env_name' to 'value'\n\nSave previous value, yield, and then restore the previous value stored in\nthe environment variable 'env_name'.\n\nIf 'value' is None, do nothing", "code": "def set_environ(env_name, value):\n    \"\"\"Set the environment variable 'env_name' to 'value'\n\n    Save previous value, yield, and then restore the previous value stored in\n    the environment variable 'env_name'.\n\n    If 'value' is None, do nothing\"\"\"\n    value_changed = value is not None\n    if value_changed:\n        old_value = os.environ.get(env_name)\n        os.environ[env_name] = value\n    try:\n        yield\n    finally:\n        if value_changed:\n            if old_value is None:\n                del os.environ[env_name]\n            else:\n                os.environ[env_name] = old_value"}, {"id": "adapters.py:HTTPAdapter.proxy_headers", "label": "proxy_headers", "title": "adapters.py:HTTPAdapter.proxy_headers [Lsyn]", "type": "function", "layer": "Lsyn", "file": "adapters.py", "line": 570, "shape": "dot", "color": {"background": "#2563eb", "border": "#ffffff"}, "size": 12, "docstring": "Returns a dictionary of the headers to add to any request sent\nthrough a proxy. This works with urllib3 magic to ensure that they are\ncorrectly sent to the proxy, rather than in a tunnelled request if\nCONNECT is being used.\n\nThis should not be called from user code, and is only exposed for use\nwhen subclassing the\n:class:`HTTPAdapter <requests.adapters.HTTPAdapter>`.\n\n:param proxy: The url of the proxy being used for this request.\n:rtype: dict", "code": "    def proxy_headers(self, proxy):\n        \"\"\"Returns a dictionary of the headers to add to any request sent\n        through a proxy. This works with urllib3 magic to ensure that they are\n        correctly sent to the proxy, rather than in a tunnelled request if\n        CONNECT is being used.\n\n        This should not be called from user code, and is only exposed for use\n        when subclassing the\n        :class:`HTTPAdapter <requests.adapters.HTTPAdapter>`.\n\n        :param proxy: The url of the proxy being used for this request.\n        :rtype: dict\n        \"\"\"\n        headers = {}\n        username, password = get_auth_from_url(proxy)\n\n        if username:\n            headers[\"Proxy-Authorization\"] = _basic_auth_str(username, password)\n\n        return headers"}, {"id": "utils.py:atomic_open", "label": "atomic_open", "title": "utils.py:atomic_open [Lsyn]", "type": "function", "layer": "Lsyn", "file": "utils.py", "line": 296, "shape": "dot", "color": {"background": "#2563eb", "border": "#ffffff"}, "size": 12, "docstring": "Write a file to the disk in an atomic fashion", "code": "def atomic_open(filename):\n    \"\"\"Write a file to the disk in an atomic fashion\"\"\"\n    tmp_descriptor, tmp_name = tempfile.mkstemp(dir=os.path.dirname(filename))\n    try:\n        with os.fdopen(tmp_descriptor, \"wb\") as tmp_handler:\n            yield tmp_handler\n        os.replace(tmp_name, filename)\n    except BaseException:\n        os.remove(tmp_name)\n        raise"}, {"id": "utils.py:parse_list_header", "label": "parse_list_header", "title": "utils.py:parse_list_header [Lsyn]", "type": "function", "layer": "Lsyn", "file": "utils.py", "line": 365, "shape": "dot", "color": {"background": "#2563eb", "border": "#ffffff"}, "size": 12, "docstring": "Parse lists as described by RFC 2068 Section 2.\n\nIn particular, parse comma-separated lists where the elements of\nthe list may include quoted-strings.  A quoted-string could\ncontain a comma.  A non-quoted string could have quotes in the\nmiddle.  Quotes are removed automatically after parsing.\n\nIt basically works like :func:`parse_set_header` just that items\nmay appear multiple times and case sensitivity is preserved.\n\nThe return value is a standard :class:`list`:\n\n>>> parse_list_header('token, \"quoted value\"')\n['token', 'quoted value']\n\nTo create a header from the :class:`list` again, use the\n:func:`dump_header` function.\n\n:param value: a string with a list header.\n:return: :class:`list`\n:rtype: list", "code": "def parse_list_header(value):\n    \"\"\"Parse lists as described by RFC 2068 Section 2.\n\n    In particular, parse comma-separated lists where the elements of\n    the list may include quoted-strings.  A quoted-string could\n    contain a comma.  A non-quoted string could have quotes in the\n    middle.  Quotes are removed automatically after parsing.\n\n    It basically works like :func:`parse_set_header` just that items\n    may appear multiple times and case sensitivity is preserved.\n\n    The return value is a standard :class:`list`:\n\n    >>> parse_list_header('token, \"quoted value\"')\n    ['token', 'quoted value']\n\n    To create a header from the :class:`list` again, use the\n    :func:`dump_header` function.\n\n    :param value: a string with a list header.\n    :return: :class:`list`\n    :rtype: list\n    \"\"\"\n    result = []\n    for item in _parse_list_header(value):\n        if item[:1] == item[-1:] == '\"':\n            item = unquote_header_value(item[1:-1])\n        result.append(item)\n    return result"}, {"id": "utils.py:get_auth_from_url", "label": "get_auth_from_url", "title": "utils.py:get_auth_from_url [Lsyn]", "type": "function", "layer": "Lsyn", "file": "utils.py", "line": 1008, "shape": "dot", "color": {"background": "#2563eb", "border": "#ffffff"}, "size": 12, "docstring": "Given a url with authentication components, extract them into a tuple of\nusername,password.\n\n:rtype: (str,str)", "code": "def get_auth_from_url(url):\n    \"\"\"Given a url with authentication components, extract them into a tuple of\n    username,password.\n\n    :rtype: (str,str)\n    \"\"\"\n    parsed = urlparse(url)\n\n    try:\n        auth = (unquote(parsed.username), unquote(parsed.password))\n    except (AttributeError, TypeError):\n        auth = (\"\", \"\")\n\n    return auth"}, {"id": "external::urlparse", "label": "urlparse", "title": "external::urlparse [Ldep]", "type": "external_func", "layer": "Ldep", "file": "utils.py", "line": 0, "shape": "dot", "color": {"background": "#0284c7", "border": "#ffffff"}, "size": 14, "docstring": "", "code": ""}, {"id": "models.py:Response.content", "label": "content", "title": "models.py:Response.content [Lsyn]", "type": "function", "layer": "Lsyn", "file": "models.py", "line": 893, "shape": "dot", "color": {"background": "#2563eb", "border": "#ffffff"}, "size": 12, "docstring": "Content of the response, in bytes.", "code": "    def content(self):\n        \"\"\"Content of the response, in bytes.\"\"\"\n\n        if self._content is False:\n            # Read the contents.\n            if self._content_consumed:\n                raise RuntimeError(\"The content for this response was already consumed\")\n\n            if self.status_code == 0 or self.raw is None:\n                self._content = None\n            else:\n                self._content = b\"\".join(self.iter_content(CONTENT_CHUNK_SIZE)) or b\"\"\n\n        self._content_consumed = True\n        # don't need to release the connection; that's been handled by urllib3\n        # since we exhausted the data.\n        return self._content"}, {"id": "structures.py:CaseInsensitiveDict.__eq__", "label": "__eq__", "title": "structures.py:CaseInsensitiveDict.__eq__ [Lsyn]", "type": "function", "layer": "Lsyn", "file": "structures.py", "line": 67, "shape": "dot", "color": {"background": "#2563eb", "border": "#ffffff"}, "size": 12, "docstring": "", "code": "    def __eq__(self, other):\n        if isinstance(other, Mapping):\n            other = CaseInsensitiveDict(other)\n        else:\n            return NotImplemented\n        # Compare insensitively\n        return dict(self.lower_items()) == dict(other.lower_items())"}, {"id": "cookies.py:get_cookie_header", "label": "get_cookie_header", "title": "cookies.py:get_cookie_header [Lsyn]", "type": "function", "layer": "Lsyn", "file": "cookies.py", "line": 140, "shape": "dot", "color": {"background": "#2563eb", "border": "#ffffff"}, "size": 12, "docstring": "Produce an appropriate Cookie header string to be sent with `request`, or None.\n\n:rtype: str", "code": "def get_cookie_header(jar, request):\n    \"\"\"\n    Produce an appropriate Cookie header string to be sent with `request`, or None.\n\n    :rtype: str\n    \"\"\"\n    r = MockRequest(request)\n    jar.add_cookie_header(r)\n    return r.get_new_headers().get(\"Cookie\")"}, {"id": "cookies.py:RequestsCookieJar.multiple_domains", "label": "multiple_domains", "title": "cookies.py:RequestsCookieJar.multiple_domains [Lsyn]", "type": "function", "layer": "Lsyn", "file": "cookies.py", "line": 293, "shape": "dot", "color": {"background": "#2563eb", "border": "#ffffff"}, "size": 12, "docstring": "Returns True if there are multiple domains in the jar.\nReturns False otherwise.\n\n:rtype: bool", "code": "    def multiple_domains(self):\n        \"\"\"Returns True if there are multiple domains in the jar.\n        Returns False otherwise.\n\n        :rtype: bool\n        \"\"\"\n        domains = []\n        for cookie in iter(self):\n            if cookie.domain is not None and cookie.domain in domains:\n                return True\n            domains.append(cookie.domain)\n        return False  # there is only one domain in jar"}, {"id": "sessions.py:SessionRedirectMixin.get_redirect_target", "label": "get_redirect_target", "title": "sessions.py:SessionRedirectMixin.get_redirect_target [Lsyn]", "type": "function", "layer": "Lsyn", "file": "sessions.py", "line": 108, "shape": "dot", "color": {"background": "#2563eb", "border": "#ffffff"}, "size": 12, "docstring": "Receives a Response. Returns a redirect URI or ``None``", "code": "    def get_redirect_target(self, resp):\n        \"\"\"Receives a Response. Returns a redirect URI or ``None``\"\"\"\n        # Due to the nature of how requests processes redirects this method will\n        # be called at least once upon the original response and at least twice\n        # on each subsequent redirect response (if any).\n        # If a custom mixin is used to handle this logic, it may be advantageous\n        # to cache the redirect location onto the response object as a private\n        # attribute.\n        if resp.is_redirect:\n            location = resp.headers[\"location\"]\n            # Currently the underlying http module on py3 decode headers\n            # in latin1, but empirical evidence suggests that latin1 is very\n            # rarely used with non-ASCII characters in HTTP headers.\n            # It is more likely to get UTF8 header rather than latin1.\n            # This causes incorrect handling of UTF8 encoded location headers.\n            # To solve this, we re-encode the location in latin1.\n            location = location.encode(\"latin1\")\n            return to_native_string(location, \"utf8\")\n        return None"}, {"id": "utils.py:guess_filename", "label": "guess_filename", "title": "utils.py:guess_filename [Lsyn]", "type": "function", "layer": "Lsyn", "file": "utils.py", "line": 250, "shape": "dot", "color": {"background": "#2563eb", "border": "#ffffff"}, "size": 12, "docstring": "Tries to guess the filename of the given object.", "code": "def guess_filename(obj):\n    \"\"\"Tries to guess the filename of the given object.\"\"\"\n    name = getattr(obj, \"name\", None)\n    if name and isinstance(name, basestring) and name[0] != \"<\" and name[-1] != \">\":\n        return os.path.basename(name)"}, {"id": "utils.py:requote_uri", "label": "requote_uri", "title": "utils.py:requote_uri [Lsyn]", "type": "function", "layer": "Lsyn", "file": "utils.py", "line": 650, "shape": "dot", "color": {"background": "#2563eb", "border": "#ffffff"}, "size": 12, "docstring": "Re-quote the given URI.\n\nThis function passes the given URI through an unquote/quote cycle to\nensure that it is fully and consistently quoted.\n\n:rtype: str", "code": "def requote_uri(uri):\n    \"\"\"Re-quote the given URI.\n\n    This function passes the given URI through an unquote/quote cycle to\n    ensure that it is fully and consistently quoted.\n\n    :rtype: str\n    \"\"\"\n    safe_with_percent = \"!#$%&'()*+,/:;=?@[]~\"\n    safe_without_percent = \"!#$&'()*+,/:;=?@[]~\"\n    try:\n        # Unquote only the unreserved characters\n        # Then quote only illegal characters (do not quote reserved,\n        # unreserved, or '%')\n        return quote(unquote_unreserved(uri), safe=safe_with_percent)\n    except InvalidURL:\n        # We couldn't unquote the given URI, so let's try quoting it, but\n        # there may be unquoted '%'s in the URI. We need to make sure they're\n        # properly quoted so they do not cause issues elsewhere.\n        return quote(uri, safe=safe_without_percent)"}, {"id": "__init__.py:_check_cryptography", "label": "_check_cryptography", "title": "__init__.py:_check_cryptography [Lsyn]", "type": "function", "layer": "Lsyn", "file": "__init__.py", "line": 93, "shape": "dot", "color": {"background": "#2563eb", "border": "#ffffff"}, "size": 12, "docstring": "", "code": "def _check_cryptography(cryptography_version):\n    # cryptography < 1.3.4\n    try:\n        cryptography_version = list(map(int, cryptography_version.split(\".\")))\n    except ValueError:\n        return\n\n    if cryptography_version < [1, 3, 4]:\n        warning = (\n            f\"Old version of cryptography ({cryptography_version}) may cause slowdown.\"\n        )\n        warnings.warn(warning, RequestsDependencyWarning)"}, {"id": "cookies.py:RequestsCookieJar.list_domains", "label": "list_domains", "title": "cookies.py:RequestsCookieJar.list_domains [Lsyn]", "type": "function", "layer": "Lsyn", "file": "cookies.py", "line": 277, "shape": "dot", "color": {"background": "#2563eb", "border": "#ffffff"}, "size": 12, "docstring": "Utility method to list all the domains in the jar.", "code": "    def list_domains(self):\n        \"\"\"Utility method to list all the domains in the jar.\"\"\"\n        domains = []\n        for cookie in iter(self):\n            if cookie.domain not in domains:\n                domains.append(cookie.domain)\n        return domains"}, {"id": "cookies.py:RequestsCookieJar.list_paths", "label": "list_paths", "title": "cookies.py:RequestsCookieJar.list_paths [Lsyn]", "type": "function", "layer": "Lsyn", "file": "cookies.py", "line": 285, "shape": "dot", "color": {"background": "#2563eb", "border": "#ffffff"}, "size": 12, "docstring": "Utility method to list all the paths in the jar.", "code": "    def list_paths(self):\n        \"\"\"Utility method to list all the paths in the jar.\"\"\"\n        paths = []\n        for cookie in iter(self):\n            if cookie.path not in paths:\n                paths.append(cookie.path)\n        return paths"}, {"id": "cookies.py:RequestsCookieJar.copy", "label": "copy", "title": "cookies.py:RequestsCookieJar.copy [Lsyn]", "type": "function", "layer": "Lsyn", "file": "cookies.py", "line": 428, "shape": "dot", "color": {"background": "#2563eb", "border": "#ffffff"}, "size": 12, "docstring": "Return a copy of this RequestsCookieJar.", "code": "    def copy(self):\n        \"\"\"Return a copy of this RequestsCookieJar.\"\"\"\n        new_cj = RequestsCookieJar()\n        new_cj.set_policy(self.get_policy())\n        new_cj.update(self)\n        return new_cj"}, {"id": "models.py:PreparedRequest.prepare_hooks", "label": "prepare_hooks", "title": "models.py:PreparedRequest.prepare_hooks [Lsyn]", "type": "function", "layer": "Lsyn", "file": "models.py", "line": 632, "shape": "dot", "color": {"background": "#2563eb", "border": "#ffffff"}, "size": 12, "docstring": "Prepares the given hooks.", "code": "    def prepare_hooks(self, hooks):\n        \"\"\"Prepares the given hooks.\"\"\"\n        # hooks can be passed as None to the prepare method and to this\n        # method. To prevent iterating over None, simply use an empty list\n        # if hooks is False-y\n        hooks = hooks or []\n        for event in hooks:\n            self.register_hook(event, hooks[event])"}, {"id": "models.py:Response.__setstate__", "label": "__setstate__", "title": "models.py:Response.__setstate__ [Lsyn]", "type": "function", "layer": "Lsyn", "file": "models.py", "line": 721, "shape": "dot", "color": {"background": "#2563eb", "border": "#ffffff"}, "size": 12, "docstring": "", "code": "    def __setstate__(self, state):\n        for name, value in state.items():\n            setattr(self, name, value)\n\n        # pickled objects do not have .raw\n        setattr(self, \"_content_consumed\", True)\n        setattr(self, \"raw\", None)"}, {"id": "utils.py:rewind_body", "label": "rewind_body", "title": "utils.py:rewind_body [Lsyn]", "type": "function", "layer": "Lsyn", "file": "utils.py", "line": 1071, "shape": "dot", "color": {"background": "#2563eb", "border": "#ffffff"}, "size": 12, "docstring": "Move file pointer back to its recorded starting position\nso it can be read again on redirect.", "code": "def rewind_body(prepared_request):\n    \"\"\"Move file pointer back to its recorded starting position\n    so it can be read again on redirect.\n    \"\"\"\n    body_seek = getattr(prepared_request.body, \"seek\", None)\n    if body_seek is not None and isinstance(\n        prepared_request._body_position, integer_types\n    ):\n        try:\n            body_seek(prepared_request._body_position)\n        except OSError:\n            raise UnrewindableBodyError(\n                \"An error occurred when rewinding request body for redirect.\"\n            )\n    else:\n        raise UnrewindableBodyError(\"Unable to rewind request body for redirect.\")"}, {"id": "external::hasattr", "label": "hasattr", "title": "external::hasattr [Ldep]", "type": "external_func", "layer": "Ldep", "file": "utils.py", "line": 0, "shape": "dot", "color": {"background": "#0284c7", "border": "#ffffff"}, "size": 14, "docstring": "", "code": ""}, {"id": "adapters.py:HTTPAdapter.build_connection_pool_key_attributes", "label": "build_connection_pool_key_attributes", "title": "adapters.py:HTTPAdapter.build_connection_pool_key_attributes [Lsyn]", "type": "function", "layer": "Lsyn", "file": "adapters.py", "line": 374, "shape": "dot", "color": {"background": "#2563eb", "border": "#ffffff"}, "size": 12, "docstring": "Build the PoolKey attributes used by urllib3 to return a connection.\n\nThis looks at the PreparedRequest, the user-specified verify value,\nand the value of the cert parameter to determine what PoolKey values\nto use to select a connection from a given urllib3 Connection Pool.\n\nThe SSL related pool key arguments are not consistently set. As of\nthis writing, use the following to determine what keys may be in that\ndictionary:\n\n* If ``verify`` is ``True``, ``\"ssl_context\"`` will be set and will be the\n  default Requests SSL Context\n* If ``verify`` is ``False``, ``\"ssl_context\"`` will not be set but\n  ``\"cert_reqs\"`` will be set\n* If ``verify`` is a string, (i.e., it is a user-specified trust bundle)\n  ``\"ca_certs\"`` will be set if the string is not a directory recognized\n  by :py:func:`os.path.isdir`, otherwise ``\"ca_cert_dir\"`` will be\n  set.\n* If ``\"cert\"`` is specified, ``\"cert_file\"`` will always be set. If\n  ``\"cert\"`` is a tuple with a second item, ``\"key_file\"`` will also\n  be present\n\nTo override these settings, one may subclass this class, call this\nmethod and use the above logic to change parameters as desired. For\nexample, if one wishes to use a custom :py:class:`ssl.SSLContext` one\nmust both set ``\"ssl_context\"`` and based on what else they require,\nalter the other keys to ensure the desired behaviour.\n\n:param request:\n    The PreparedReqest being sent over the connection.\n:type request:\n    :class:`~requests.models.PreparedRequest`\n:param verify:\n    Either a boolean, in which case it controls whether\n    we verify the server's TLS certificate, or a string, in which case it\n    must be a path to a CA bundle to use.\n:param cert:\n    (optional) Any user-provided SSL certificate for client\n    authentication (a.k.a., mTLS). This may be a string (i.e., just\n    the path to a file which holds both certificate and key) or a\n    tuple of length 2 with the certificate file path and key file\n    path.\n:returns:\n    A tuple of two dictionaries. The first is the \"host parameters\"\n    portion of the Pool Key including scheme, hostname, and port. The\n    second is a dictionary of SSLContext related parameters.", "code": "    def build_connection_pool_key_attributes(self, request, verify, cert=None):\n        \"\"\"Build the PoolKey attributes used by urllib3 to return a connection.\n\n        This looks at the PreparedRequest, the user-specified verify value,\n        and the value of the cert parameter to determine what PoolKey values\n        to use to select a connection from a given urllib3 Connection Pool.\n\n        The SSL related pool key arguments are not consistently set. As of\n        this writing, use the following to determine what keys may be in that\n        dictionary:\n\n        * If ``verify`` is ``True``, ``\"ssl_context\"`` will be set and will be the\n          default Requests SSL Context\n        * If ``verify`` is ``False``, ``\"ssl_context\"`` will not be set but\n          ``\"cert_reqs\"`` will be set\n        * If ``verify`` is a string, (i.e., it is a user-specified trust bundle)\n          ``\"ca_certs\"`` will be set if the string is not a directory recognized\n          by :py:func:`os.path.isdir`, otherwise ``\"ca_cert_dir\"`` will be\n          set.\n        * If ``\"cert\"`` is specified, ``\"cert_file\"`` will always be set. If\n          ``\"cert\"`` is a tuple with a second item, ``\"key_file\"`` will also\n          be present\n\n        To override these settings, one may subclass this class, call this\n        method and use the above logic to change parameters as desired. For\n        example, if one wishes to use a custom :py:class:`ssl.SSLContext` one\n        must both set ``\"ssl_context\"`` and based on what else they require,\n        alter the other keys to ensure the desired behaviour.\n\n        :param request:\n            The PreparedReqest being sent over the connection.\n        :type request:\n            :class:`~requests.models.PreparedRequest`\n        :param verify:\n            Either a boolean, in which case it controls whether\n            we verify the server's TLS certificate, or a string, in which case it\n            must be a path to a CA bundle to use.\n        :param cert:\n            (optional) Any user-provided SSL certificate for client\n            authentication (a.k.a., mTLS). This may be a string (i.e., just\n            the path to a file which holds both certificate and key) or a\n            tuple of length 2 with the certificate file path and key file\n            path.\n        :returns:\n            A tuple of two dictionaries. The first is the \"host parameters\"\n            portion of the Pool Key including scheme, hostname, and port. The\n            second is a dictionary of SSLContext related parameters.\n        \"\"\"\n        return _urllib3_request_context(request, verify, cert, self.poolmanager)"}, {"id": "cookies.py:MockRequest.get_header", "label": "get_header", "title": "cookies.py:MockRequest.get_header [Lsyn]", "type": "function", "layer": "Lsyn", "file": "cookies.py", "line": 75, "shape": "dot", "color": {"background": "#2563eb", "border": "#ffffff"}, "size": 12, "docstring": "", "code": "    def get_header(self, name, default=None):\n        return self._r.headers.get(name, self._new_headers.get(name, default))"}, {"id": "models.py:Response.iter_content.generate", "label": "generate", "title": "models.py:Response.iter_content.generate [Lsyn]", "type": "function", "layer": "Lsyn", "file": "models.py", "line": 818, "shape": "dot", "color": {"background": "#2563eb", "border": "#ffffff"}, "size": 12, "docstring": "", "code": "        def generate():\n            # Special case for urllib3.\n            if hasattr(self.raw, \"stream\"):\n                try:\n                    yield from self.raw.stream(chunk_size, decode_content=True)\n                except ProtocolError as e:\n                    raise ChunkedEncodingError(e)\n                except DecodeError as e:\n                    raise ContentDecodingError(e)\n                except ReadTimeoutError as e:\n                    raise ConnectionError(e)\n                except SSLError as e:\n                    raise RequestsSSLError(e)\n            else:\n                # Standard file-like object.\n                while True:\n                    chunk = self.raw.read(chunk_size)\n                    if not chunk:\n                        break\n                    yield chunk\n\n            self._content_consumed = True"}, {"id": "models.py:Response.close", "label": "close", "title": "models.py:Response.close [Lsyn]", "type": "function", "layer": "Lsyn", "file": "models.py", "line": 1030, "shape": "dot", "color": {"background": "#2563eb", "border": "#ffffff"}, "size": 12, "docstring": "Releases the connection back to the pool. Once this method has been\ncalled the underlying ``raw`` object must not be accessed again.\n\n*Note: Should not normally need to be called explicitly.*", "code": "    def close(self):\n        \"\"\"Releases the connection back to the pool. Once this method has been\n        called the underlying ``raw`` object must not be accessed again.\n\n        *Note: Should not normally need to be called explicitly.*\n        \"\"\"\n        if not self._content_consumed:\n            self.raw.close()\n\n        release_conn = getattr(self.raw, \"release_conn\", None)\n        if release_conn is not None:\n            release_conn()"}, {"id": "structures.py:CaseInsensitiveDict.__init__", "label": "__init__", "title": "structures.py:CaseInsensitiveDict.__init__ [Lsyn]", "type": "function", "layer": "Lsyn", "file": "structures.py", "line": 40, "shape": "dot", "color": {"background": "#2563eb", "border": "#ffffff"}, "size": 12, "docstring": "", "code": "    def __init__(self, data=None, **kwargs):\n        self._store = OrderedDict()\n        if data is None:\n            data = {}\n        self.update(data, **kwargs)"}, {"id": "utils.py:from_key_val_list", "label": "from_key_val_list", "title": "utils.py:from_key_val_list [Lsyn]", "type": "function", "layer": "Lsyn", "file": "utils.py", "line": 308, "shape": "dot", "color": {"background": "#2563eb", "border": "#ffffff"}, "size": 12, "docstring": "Take an object and test to see if it can be represented as a\ndictionary. Unless it can not be represented as such, return an\nOrderedDict, e.g.,\n\n::\n\n    >>> from_key_val_list([('key', 'val')])\n    OrderedDict([('key', 'val')])\n    >>> from_key_val_list('string')\n    Traceback (most recent call last):\n    ...\n    ValueError: cannot encode objects that are not 2-tuples\n    >>> from_key_val_list({'key': 'val'})\n    OrderedDict([('key', 'val')])\n\n:rtype: OrderedDict", "code": "def from_key_val_list(value):\n    \"\"\"Take an object and test to see if it can be represented as a\n    dictionary. Unless it can not be represented as such, return an\n    OrderedDict, e.g.,\n\n    ::\n\n        >>> from_key_val_list([('key', 'val')])\n        OrderedDict([('key', 'val')])\n        >>> from_key_val_list('string')\n        Traceback (most recent call last):\n        ...\n        ValueError: cannot encode objects that are not 2-tuples\n        >>> from_key_val_list({'key': 'val'})\n        OrderedDict([('key', 'val')])\n\n    :rtype: OrderedDict\n    \"\"\"\n    if value is None:\n        return None\n\n    if isinstance(value, (str, bytes, bool, int)):\n        raise ValueError(\"cannot encode objects that are not 2-tuples\")\n\n    return OrderedDict(value)"}, {"id": "auth.py:HTTPDigestAuth.init_per_thread_state", "label": "init_per_thread_state", "title": "auth.py:HTTPDigestAuth.init_per_thread_state [Lsyn]", "type": "function", "layer": "Lsyn", "file": "auth.py", "line": 116, "shape": "dot", "color": {"background": "#2563eb", "border": "#ffffff"}, "size": 12, "docstring": "", "code": "    def init_per_thread_state(self):\n        # Ensure state is initialized just once per-thread\n        if not hasattr(self._thread_local, \"init\"):\n            self._thread_local.init = True\n            self._thread_local.last_nonce = \"\"\n            self._thread_local.nonce_count = 0\n            self._thread_local.chal = {}\n            self._thread_local.pos = None\n            self._thread_local.num_401_calls = None"}, {"id": "auth.py:HTTPDigestAuth.build_digest_header.md5_utf8", "label": "md5_utf8", "title": "auth.py:HTTPDigestAuth.build_digest_header.md5_utf8 [Lsyn]", "type": "function", "layer": "Lsyn", "file": "auth.py", "line": 145, "shape": "dot", "color": {"background": "#2563eb", "border": "#ffffff"}, "size": 12, "docstring": "", "code": "            def md5_utf8(x):\n                if isinstance(x, str):\n                    x = x.encode(\"utf-8\")\n                return hashlib.md5(x).hexdigest()"}, {"id": "auth.py:HTTPDigestAuth.build_digest_header.sha_utf8", "label": "sha_utf8", "title": "auth.py:HTTPDigestAuth.build_digest_header.sha_utf8 [Lsyn]", "type": "function", "layer": "Lsyn", "file": "auth.py", "line": 153, "shape": "dot", "color": {"background": "#2563eb", "border": "#ffffff"}, "size": 12, "docstring": "", "code": "            def sha_utf8(x):\n                if isinstance(x, str):\n                    x = x.encode(\"utf-8\")\n                return hashlib.sha1(x).hexdigest()"}, {"id": "auth.py:HTTPDigestAuth.build_digest_header.sha256_utf8", "label": "sha256_utf8", "title": "auth.py:HTTPDigestAuth.build_digest_header.sha256_utf8 [Lsyn]", "type": "function", "layer": "Lsyn", "file": "auth.py", "line": 161, "shape": "dot", "color": {"background": "#2563eb", "border": "#ffffff"}, "size": 12, "docstring": "", "code": "            def sha256_utf8(x):\n                if isinstance(x, str):\n                    x = x.encode(\"utf-8\")\n                return hashlib.sha256(x).hexdigest()"}, {"id": "auth.py:HTTPDigestAuth.build_digest_header.sha512_utf8", "label": "sha512_utf8", "title": "auth.py:HTTPDigestAuth.build_digest_header.sha512_utf8 [Lsyn]", "type": "function", "layer": "Lsyn", "file": "auth.py", "line": 169, "shape": "dot", "color": {"background": "#2563eb", "border": "#ffffff"}, "size": 12, "docstring": "", "code": "            def sha512_utf8(x):\n                if isinstance(x, str):\n                    x = x.encode(\"utf-8\")\n                return hashlib.sha512(x).hexdigest()"}, {"id": "cookies.py:RequestsCookieJar.__getstate__", "label": "__getstate__", "title": "cookies.py:RequestsCookieJar.__getstate__ [Lsyn]", "type": "function", "layer": "Lsyn", "file": "cookies.py", "line": 415, "shape": "dot", "color": {"background": "#2563eb", "border": "#ffffff"}, "size": 12, "docstring": "Unlike a normal CookieJar, this class is pickleable.", "code": "    def __getstate__(self):\n        \"\"\"Unlike a normal CookieJar, this class is pickleable.\"\"\"\n        state = self.__dict__.copy()\n        # remove the unpickleable RLock object\n        state.pop(\"_cookies_lock\")\n        return state"}, {"id": "cookies.py:RequestsCookieJar.__setstate__", "label": "__setstate__", "title": "cookies.py:RequestsCookieJar.__setstate__ [Lsyn]", "type": "function", "layer": "Lsyn", "file": "cookies.py", "line": 422, "shape": "dot", "color": {"background": "#2563eb", "border": "#ffffff"}, "size": 12, "docstring": "Unlike a normal CookieJar, this class is pickleable.", "code": "    def __setstate__(self, state):\n        \"\"\"Unlike a normal CookieJar, this class is pickleable.\"\"\"\n        self.__dict__.update(state)\n        if \"_cookies_lock\" not in self.__dict__:\n            self._cookies_lock = threading.RLock()"}, {"id": "exceptions.py:JSONDecodeError.__init__", "label": "__init__", "title": "exceptions.py:JSONDecodeError.__init__ [Lsyn]", "type": "function", "layer": "Lsyn", "file": "exceptions.py", "line": 35, "shape": "dot", "color": {"background": "#2563eb", "border": "#ffffff"}, "size": 12, "docstring": "Construct the JSONDecodeError instance first with all\nargs. Then use it's args to construct the IOError so that\nthe json specific args aren't used as IOError specific args\nand the error message from JSONDecodeError is preserved.", "code": "    def __init__(self, *args, **kwargs):\n        \"\"\"\n        Construct the JSONDecodeError instance first with all\n        args. Then use it's args to construct the IOError so that\n        the json specific args aren't used as IOError specific args\n        and the error message from JSONDecodeError is preserved.\n        \"\"\"\n        CompatJSONDecodeError.__init__(self, *args)\n        InvalidJSONError.__init__(self, *self.args, **kwargs)"}, {"id": "models.py:PreparedRequest.prepare_method", "label": "prepare_method", "title": "models.py:PreparedRequest.prepare_method [Lsyn]", "type": "function", "layer": "Lsyn", "file": "models.py", "line": 395, "shape": "dot", "color": {"background": "#2563eb", "border": "#ffffff"}, "size": 12, "docstring": "Prepares the given HTTP method.", "code": "    def prepare_method(self, method):\n        \"\"\"Prepares the given HTTP method.\"\"\"\n        self.method = method\n        if self.method is not None:\n            self.method = to_native_string(self.method.upper())"}, {"id": "sessions.py:Session.__setstate__", "label": "__setstate__", "title": "sessions.py:Session.__setstate__ [Lsyn]", "type": "function", "layer": "Lsyn", "file": "sessions.py", "line": 817, "shape": "dot", "color": {"background": "#2563eb", "border": "#ffffff"}, "size": 12, "docstring": "", "code": "    def __setstate__(self, state):\n        for attr, value in state.items():\n            setattr(self, attr, value)"}, {"id": "utils.py:get_environ_proxies", "label": "get_environ_proxies", "title": "utils.py:get_environ_proxies [Lsyn]", "type": "function", "layer": "Lsyn", "file": "utils.py", "line": 816, "shape": "dot", "color": {"background": "#2563eb", "border": "#ffffff"}, "size": 12, "docstring": "Return a dict of environment proxies.\n\n:rtype: dict", "code": "def get_environ_proxies(url, no_proxy=None):\n    \"\"\"\n    Return a dict of environment proxies.\n\n    :rtype: dict\n    \"\"\"\n    if should_bypass_proxies(url, no_proxy=no_proxy):\n        return {}\n    else:\n        return getproxies()"}, {"id": "utils.py:check_header_validity", "label": "check_header_validity", "title": "utils.py:check_header_validity [Lsyn]", "type": "function", "layer": "Lsyn", "file": "utils.py", "line": 1024, "shape": "dot", "color": {"background": "#2563eb", "border": "#ffffff"}, "size": 12, "docstring": "Verifies that header parts don't contain leading whitespace\nreserved characters, or return characters.\n\n:param header: tuple, in the format (name, value).", "code": "def check_header_validity(header):\n    \"\"\"Verifies that header parts don't contain leading whitespace\n    reserved characters, or return characters.\n\n    :param header: tuple, in the format (name, value).\n    \"\"\"\n    name, value = header\n    _validate_header_part(header, name, 0)\n    _validate_header_part(header, value, 1)"}, {"id": "external::len", "label": "len", "title": "external::len [Ldep]", "type": "external_func", "layer": "Ldep", "file": "utils.py", "line": 0, "shape": "dot", "color": {"background": "#0284c7", "border": "#ffffff"}, "size": 14, "docstring": "", "code": ""}, {"id": "external::getattr", "label": "getattr", "title": "external::getattr [Ldep]", "type": "external_func", "layer": "Ldep", "file": "utils.py", "line": 0, "shape": "dot", "color": {"background": "#0284c7", "border": "#ffffff"}, "size": 14, "docstring": "", "code": ""}, {"id": "adapters.py:BaseAdapter.send", "label": "send", "title": "adapters.py:BaseAdapter.send [Lsyn]", "type": "function", "layer": "Lsyn", "file": "adapters.py", "line": 120, "shape": "dot", "color": {"background": "#2563eb", "border": "#ffffff"}, "size": 12, "docstring": "Sends PreparedRequest object. Returns Response object.\n\n:param request: The :class:`PreparedRequest <PreparedRequest>` being sent.\n:param stream: (optional) Whether to stream the request content.\n:param timeout: (optional) How long to wait for the server to send\n    data before giving up, as a float, or a :ref:`(connect timeout,\n    read timeout) <timeouts>` tuple.\n:type timeout: float or tuple\n:param verify: (optional) Either a boolean, in which case it controls whether we verify\n    the server's TLS certificate, or a string, in which case it must be a path\n    to a CA bundle to use\n:param cert: (optional) Any user-provided SSL certificate to be trusted.\n:param proxies: (optional) The proxies dictionary to apply to the request.", "code": "    def send(\n        self, request, stream=False, timeout=None, verify=True, cert=None, proxies=None\n    ):\n        \"\"\"Sends PreparedRequest object. Returns Response object.\n\n        :param request: The :class:`PreparedRequest <PreparedRequest>` being sent.\n        :param stream: (optional) Whether to stream the request content.\n        :param timeout: (optional) How long to wait for the server to send\n            data before giving up, as a float, or a :ref:`(connect timeout,\n            read timeout) <timeouts>` tuple.\n        :type timeout: float or tuple\n        :param verify: (optional) Either a boolean, in which case it controls whether we verify\n            the server's TLS certificate, or a string, in which case it must be a path\n            to a CA bundle to use\n        :param cert: (optional) Any user-provided SSL certificate to be trusted.\n        :param proxies: (optional) The proxies dictionary to apply to the request.\n        \"\"\"\n        raise NotImplementedError"}, {"id": "auth.py:HTTPBasicAuth.__eq__", "label": "__eq__", "title": "auth.py:HTTPBasicAuth.__eq__ [Lsyn]", "type": "function", "layer": "Lsyn", "file": "auth.py", "line": 83, "shape": "dot", "color": {"background": "#2563eb", "border": "#ffffff"}, "size": 12, "docstring": "", "code": "    def __eq__(self, other):\n        return all(\n            [\n                self.username == getattr(other, \"username\", None),\n                self.password == getattr(other, \"password\", None),\n            ]\n        )"}, {"id": "auth.py:HTTPDigestAuth.__init__", "label": "__init__", "title": "auth.py:HTTPDigestAuth.__init__ [Lsyn]", "type": "function", "layer": "Lsyn", "file": "auth.py", "line": 110, "shape": "dot", "color": {"background": "#2563eb", "border": "#ffffff"}, "size": 12, "docstring": "", "code": "    def __init__(self, username, password):\n        self.username = username\n        self.password = password\n        # Keep state in per-thread local storage\n        self._thread_local = threading.local()"}, {"id": "auth.py:HTTPDigestAuth.__eq__", "label": "__eq__", "title": "auth.py:HTTPDigestAuth.__eq__ [Lsyn]", "type": "function", "layer": "Lsyn", "file": "auth.py", "line": 305, "shape": "dot", "color": {"background": "#2563eb", "border": "#ffffff"}, "size": 12, "docstring": "", "code": "    def __eq__(self, other):\n        return all(\n            [\n                self.username == getattr(other, \"username\", None),\n                self.password == getattr(other, \"password\", None),\n            ]\n        )"}, {"id": "cookies.py:RequestsCookieJar.values", "label": "values", "title": "cookies.py:RequestsCookieJar.values [Lsyn]", "type": "function", "layer": "Lsyn", "file": "cookies.py", "line": 251, "shape": "dot", "color": {"background": "#2563eb", "border": "#ffffff"}, "size": 12, "docstring": "Dict-like values() that returns a list of values of cookies from the\njar.\n\n.. seealso:: keys() and items().", "code": "    def values(self):\n        \"\"\"Dict-like values() that returns a list of values of cookies from the\n        jar.\n\n        .. seealso:: keys() and items().\n        \"\"\"\n        return list(self.itervalues())"}, {"id": "models.py:RequestHooksMixin.deregister_hook", "label": "deregister_hook", "title": "models.py:RequestHooksMixin.deregister_hook [Lsyn]", "type": "function", "layer": "Lsyn", "file": "models.py", "line": 220, "shape": "dot", "color": {"background": "#2563eb", "border": "#ffffff"}, "size": 12, "docstring": "Deregister a previously registered hook.\nReturns True if the hook existed, False if not.", "code": "    def deregister_hook(self, event, hook):\n        \"\"\"Deregister a previously registered hook.\n        Returns True if the hook existed, False if not.\n        \"\"\"\n\n        try:\n            self.hooks[event].remove(hook)\n            return True\n        except ValueError:\n            return False"}, {"id": "models.py:PreparedRequest.__init__", "label": "__init__", "title": "models.py:PreparedRequest.__init__ [Lsyn]", "type": "function", "layer": "Lsyn", "file": "models.py", "line": 336, "shape": "dot", "color": {"background": "#2563eb", "border": "#ffffff"}, "size": 12, "docstring": "", "code": "    def __init__(self):\n        #: HTTP verb to send to the server.\n        self.method = None\n        #: HTTP URL to send the request to.\n        self.url = None\n        #: dictionary of HTTP headers.\n        self.headers = None\n        # The `CookieJar` used to create the Cookie header will be stored here\n        # after prepare_cookies is called\n        self._cookies = None\n        #: request body to send to the server.\n        self.body = None\n        #: dictionary of callback hooks, for internal usage.\n        self.hooks = default_hooks()\n        #: integer denoting starting position of a readable file-like body.\n        self._body_position = None"}, {"id": "models.py:Response.ok", "label": "ok", "title": "models.py:Response.ok [Lsyn]", "type": "function", "layer": "Lsyn", "file": "models.py", "line": 757, "shape": "dot", "color": {"background": "#2563eb", "border": "#ffffff"}, "size": 12, "docstring": "Returns True if :attr:`status_code` is less than 400, False if not.\n\nThis attribute checks if the status code of the response is between\n400 and 600 to see if there was a client error or a server error. If\nthe status code is between 200 and 400, this will return True. This\nis **not** a check to see if the response code is ``200 OK``.", "code": "    def ok(self):\n        \"\"\"Returns True if :attr:`status_code` is less than 400, False if not.\n\n        This attribute checks if the status code of the response is between\n        400 and 600 to see if there was a client error or a server error. If\n        the status code is between 200 and 400, this will return True. This\n        is **not** a check to see if the response code is ``200 OK``.\n        \"\"\"\n        try:\n            self.raise_for_status()\n        except HTTPError:\n            return False\n        return True"}, {"id": "external::join", "label": "join", "title": "external::join [Ldep]", "type": "external_func", "layer": "Ldep", "file": "utils.py", "line": 0, "shape": "dot", "color": {"background": "#0284c7", "border": "#ffffff"}, "size": 14, "docstring": "", "code": ""}, {"id": "_internal_utils.py:unicode_is_ascii", "label": "unicode_is_ascii", "title": "_internal_utils.py:unicode_is_ascii [Lsyn]", "type": "function", "layer": "Lsyn", "file": "_internal_utils.py", "line": 39, "shape": "dot", "color": {"background": "#2563eb", "border": "#ffffff"}, "size": 12, "docstring": "Determine if unicode string only contains ASCII characters.\n\n:param str u_string: unicode string to check. Must be unicode\n    and not Python 2 `str`.\n:rtype: bool", "code": "def unicode_is_ascii(u_string):\n    \"\"\"Determine if unicode string only contains ASCII characters.\n\n    :param str u_string: unicode string to check. Must be unicode\n        and not Python 2 `str`.\n    :rtype: bool\n    \"\"\"\n    assert isinstance(u_string, str)\n    try:\n        u_string.encode(\"ascii\")\n        return True\n    except UnicodeEncodeError:\n        return False"}, {"id": "adapters.py:HTTPAdapter.close", "label": "close", "title": "adapters.py:HTTPAdapter.close [Lsyn]", "type": "function", "layer": "Lsyn", "file": "adapters.py", "line": 514, "shape": "dot", "color": {"background": "#2563eb", "border": "#ffffff"}, "size": 12, "docstring": "Disposes of any internal state.\n\nCurrently, this closes the PoolManager and any active ProxyManager,\nwhich closes any pooled connections.", "code": "    def close(self):\n        \"\"\"Disposes of any internal state.\n\n        Currently, this closes the PoolManager and any active ProxyManager,\n        which closes any pooled connections.\n        \"\"\"\n        self.poolmanager.clear()\n        for proxy in self.proxy_manager.values():\n            proxy.clear()"}, {"id": "auth.py:HTTPBasicAuth.__call__", "label": "__call__", "title": "auth.py:HTTPBasicAuth.__call__ [Lsyn]", "type": "function", "layer": "Lsyn", "file": "auth.py", "line": 94, "shape": "dot", "color": {"background": "#2563eb", "border": "#ffffff"}, "size": 12, "docstring": "", "code": "    def __call__(self, r):\n        r.headers[\"Authorization\"] = _basic_auth_str(self.username, self.password)\n        return r"}, {"id": "auth.py:HTTPProxyAuth.__call__", "label": "__call__", "title": "auth.py:HTTPProxyAuth.__call__ [Lsyn]", "type": "function", "layer": "Lsyn", "file": "auth.py", "line": 102, "shape": "dot", "color": {"background": "#2563eb", "border": "#ffffff"}, "size": 12, "docstring": "", "code": "    def __call__(self, r):\n        r.headers[\"Proxy-Authorization\"] = _basic_auth_str(self.username, self.password)\n        return r"}, {"id": "compat.py:_resolve_char_detection", "label": "_resolve_char_detection", "title": "compat.py:_resolve_char_detection [Lsyn]", "type": "function", "layer": "Lsyn", "file": "compat.py", "line": 30, "shape": "dot", "color": {"background": "#2563eb", "border": "#ffffff"}, "size": 12, "docstring": "Find supported character detection libraries.", "code": "def _resolve_char_detection():\n    \"\"\"Find supported character detection libraries.\"\"\"\n    chardet = None\n    for lib in (\"chardet\", \"charset_normalizer\"):\n        if chardet is None:\n            try:\n                chardet = importlib.import_module(lib)\n            except ImportError:\n                pass\n    return chardet"}, {"id": "cookies.py:MockRequest.__init__", "label": "__init__", "title": "cookies.py:MockRequest.__init__ [Lsyn]", "type": "function", "layer": "Lsyn", "file": "cookies.py", "line": 35, "shape": "dot", "color": {"background": "#2563eb", "border": "#ffffff"}, "size": 12, "docstring": "", "code": "    def __init__(self, request):\n        self._r = request\n        self._new_headers = {}\n        self.type = urlparse(self._r.url).scheme"}, {"id": "cookies.py:RequestsCookieJar.__contains__", "label": "__contains__", "title": "cookies.py:RequestsCookieJar.__contains__ [Lsyn]", "type": "function", "layer": "Lsyn", "file": "cookies.py", "line": 321, "shape": "dot", "color": {"background": "#2563eb", "border": "#ffffff"}, "size": 12, "docstring": "", "code": "    def __contains__(self, name):\n        try:\n            return super().__contains__(name)\n        except CookieConflictError:\n            return True"}, {"id": "models.py:PreparedRequest._get_idna_encoded_host", "label": "_get_idna_encoded_host", "title": "models.py:PreparedRequest._get_idna_encoded_host [Lsyn]", "type": "function", "layer": "Lsyn", "file": "models.py", "line": 402, "shape": "dot", "color": {"background": "#2563eb", "border": "#ffffff"}, "size": 12, "docstring": "", "code": "    def _get_idna_encoded_host(host):\n        import idna\n\n        try:\n            host = idna.encode(host, uts46=True).decode(\"utf-8\")\n        except idna.IDNAError:\n            raise UnicodeError\n        return host"}, {"id": "status_codes.py:_init.doc", "label": "doc", "title": "status_codes.py:_init.doc [Lsyn]", "type": "function", "layer": "Lsyn", "file": "status_codes.py", "line": 116, "shape": "dot", "color": {"background": "#2563eb", "border": "#ffffff"}, "size": 12, "docstring": "", "code": "    def doc(code):\n        names = \", \".join(f\"``{n}``\" for n in _codes[code])\n        return \"* %d: %s\" % (code, names)"}, {"id": "structures.py:CaseInsensitiveDict.__setitem__", "label": "__setitem__", "title": "structures.py:CaseInsensitiveDict.__setitem__ [Lsyn]", "type": "function", "layer": "Lsyn", "file": "structures.py", "line": 46, "shape": "dot", "color": {"background": "#2563eb", "border": "#ffffff"}, "size": 12, "docstring": "", "code": "    def __set syn", "file": "utils.py", "line": 468, "shape": "dot", "color": {"background": "#2563eb", "border": "#ffffff"}, "size": 12, "docstring": "Returns a CookieJar from a key/value dictionary.\n\n:param cj: CookieJar to insert cookies into.\n:param cookie_dict: Dict of key/values to insert into CookieJar.\n:rtype: CookieJar", "code": "def add_dict_to_cookiejar(cj, cookie_dict):\n    \"\"\"Returns a CookieJar from a key/value dictionary.\n\n    :param cj: CookieJar to insert cookies into.\n    :param cookie_dict: Dict of key/values to insert into CookieJar.\n    :rtype: CookieJar\n    \"\"\"\n\n    return cookiejar_from_dict(cookie_dict, cj)"}, {"id": "utils.py:dotted_netmask", "label": "dotted_netmask", "title": "utils.py:dotted_netmask [Lsyn]", "type": "function", "layer": "Lsyn", "file": "utils.py", "line": 687, "shape": "dot", "color": {"background": "#2563eb", "border": "#ffffff"}, "size": 12, "docstring": "Converts mask from /xx format to xxx.xxx.xxx.xxx\n\nExample: if mask is 24 function returns 255.255.255.0\n\n:rtype: str", "code": "def dotted_netmask(mask):\n    \"\"\"Converts mask from /xx format to xxx.xxx.xxx.xxx\n\n    Example: if mask is 24 function returns 255.255.255.0\n\n    :rtype: str\n    \"\"\"\n    bits = 0xFFFFFFFF ^ (1 << 32 - mask) - 1\n    return socket.inet_ntoa(struct.pack(\">I\", bits))"}, {"id": "external::iter", "label": "iter", "title": "external::iter [Ldep]", "type": "external_func", "layer": "Ldep", "file": "utils.py", "line": 0, "shape": "dot", "color": {"background": "#0284c7", "border": "#ffffff"}, "size": 14, "docstring": "", "code": ""}, {"id": "auth.py:HTTPBasicAuth.__init__", "label": "__init__", "title": "auth.py:HTTPBasicAuth.__init__ [Lsyn]", "type": "function", "layer": "Lsyn", "file": "auth.py", "line": 79, "shape": "dot", "color": {"background": "#2563eb", "border": "#ffffff"}, "size": 12, "docstring": "", "code": "    def __init__(self, username, password):\n        self.username = username\n        self.password = password"}, {"id": "cookies.py:MockRequest.has_header", "label": "has_header", "title": "cookies.py:MockRequest.has_header [Lsyn]", "type": "function", "layer": "Lsyn", "file": "cookies.py", "line": 72, "shape": "dot", "color": {"background": "#2563eb", "border": "#ffffff"}, "size": 12, "docstring": "", "code": "    def has_header(self, name):\n        return name in self._r.headers or name in self._new_headers"}, {"id": "cookies.py:RequestsCookieJar.iteritems", "label": "iteritems", "title": "cookies.py:RequestsCookieJar.iteritems [Lsyn]", "type": "function", "layer": "Lsyn", "file": "cookies.py", "line": 259, "shape": "dot", "color": {"background": "#2563eb", "border": "#ffffff"}, "size": 12, "docstring": "Dict-like iteritems() that returns an iterator of name-value tuples\nfrom the jar.\n\n.. seealso:: iterkeys() and itervalues().", "code": "    def iteritems(self):\n        \"\"\"Dict-like iteritems() that returns an iterator of name-value tuples\n        from the jar.\n\n        .. seealso:: iterkeys() and itervalues().\n        \"\"\"\n        for cookie in iter(self):\n            yield cookie.name, cookie.value"}, {"id": "cookies.py:RequestsCookieJar.__setitem__", "label": "__setitem__", "title": "cookies.py:RequestsCookieJar.__setitem__ [Lsyn]", "type": "function", "layer": "Lsyn", "file": "cookies.py", "line": 336, "shape": "dot", "color": {"background": "#2563eb", "border": "#ffffff"}, "size": 12, "docstring": "Dict-like __setitem__ for compatibility with client code. Throws\nexception if there is already a cookie of that name in the jar. In that\ncase, use the more explicit set() method instead.", "code": "    def __setitem__(self, name, value):\n        \"\"\"Dict-like __setitem__ for compatibility with client code. Throws\n        exception if there is already a cookie of that name in the jar. In that\n        case, use the more explicit set() method instead.\n        \"\"\"\n        self.set(name, value)"}, {"id": "models.py:Response.__getstate__", "label": "  between\n400 and 600 to see if there was a client error or a server error. If\nthe status code, is between 200 and 400, this will return True. This\nis **not** a check to see if the response code is ``200 OK``.", "code": "    def __nonzero__(self):\n        \"\"\"Returns True if :attr:`status_code` is less than 400.\n\n        This attribute checks if the status code of the response is between\n        400 and 600 to see if there was a client error or a server error. If\n        the status code, is between 200 and 400, this will return True. This\n        is **not** a check to see if the response code is ``200 OK``.\n        \"\"\"\n        return self.ok"}, {"id": "sessions.py:Session.close", "label": "close", "title": "sessions.py:Session.close [Lsyn]", "type": "function", "layer": "Lsyn", "file": "sessions.py", "line": 797, "shape": "dot", "color": {"background": "#2563eb", "border": "#ffffff"}, "size": 12, "docstring": "Closes all adapters and as such the session", "code": "    def close(self):\n        \"\"\"Closes all adapters and as such the session\"\"\"\n        for v in self.adapters.values():\n            v.close()"}, {"id": "sessions.py:Session.__getstate__", "label": "__getstate__", "title": "sessions.py:Session.__getstate__ [Lsyn]", "type": "function", "layer": "Lsyn", "file": "sessions.py", "line": 813, "shape": "dot", "color": {"background": "#2563eb", "border": "#ffffff"}, "size": 12, "docstring": "", "code": "    def __getstate__(self):\n        state = {attr: getattr(self, attr, None) for attr in self.__attrs__}\n        return state"}, {"id": "utils.py:should_bypass_proxies.get_proxy", "label": "get_proxy", "title": "utils.py:should_bypass_proxies.get_proxy [Lsyn]", "type": "function", "layer": "Lsyn", "file": "utils.py", "line": 764, "shape": "dot", "color": {"background": "#2563eb", "border": "#ffffff"}, "size": 12, "docstring": "", "code": "    def get_proxy(key):\n        return os.environ.get(key) or os.environ.get(key.upper())"}, {"id": "cookies.py:MockRequest.get_host", "label": "get_host", "title": "cookies.py:MockRequest.get_host [Lsyn]", "type": "function", "layer": "Lsyn", "file": "cookies.py", "line": 43, "shape": "dot", "color": {"background": "#2563eb", "border": "#ffffff"}, "size": 12, "docstring": "", "code": "    def get_host(self):\n        return urlparse(self._r.url).netloc"}, {"id": "cookies.py:MockRequest.add_unredirected_header", "label": "add_unredirected_header", "title": "cookies.py:MockRequest.add_unredirected_header [Lsyn]", "type": "function", "layer": "Lsyn", "file": "cookies.py", "line": 84, "shape": "dot", "color": {"background": "#2563eb", "border": "#ffffff"}, "size": 12, "docstring": "", "code": "    def add_unredirected_header(self, name, value):\n        self._new_headers[name] = value"}, {"id": "cookies.py:MockResponse.getheaders", "label": "getheaders", "title": "cookies.py:MockResponse.getheaders [Lsyn]", "type": "function", "layer": "Lsyn", "file": "cookies.py", "line": 120, "shape": "dot", "color": {"background": "#2563eb", "border": "#ffffff"}, "size": 12, "docstring": "", "code": "    def getheaders(self, name):\n        self._headers.getheaders(name)"}, {"id": "cookies.py:RequestsCookieJar.iterkeys", "label": "iterkeys", "title": "cookies.py:RequestsCookieJar.iterkeys [Lsyn]", "type": "function", "layer": "Lsyn", "file": "cookies.py", "line": 225, "shape": "dot", "color": {"background": "#2563eb", "border": "#ffffff"}, "size": 12, "docstring": "Dict-like iterkeys() that returns an iterator of names of cookies\nfrom the jar.\n\n.. seealso:: itervalues() and iteritems().", "code": "    def iterkeys(self):\n        \"\"\"Dict-like iterkeys() that returns an iterator of names of cookies\n        from the jar.\n\n        .. seealso:: itervalues() and iteritems().\n        \"\"\"\n        for cookie in iter(self):\n            yield cookie.name"}, {"id": "cookies.py:RequestsCookieJar.itervalues", "label": "itervalues", "title": "cookies.py:RequestsCookieJar.itervalues tructures.py:CaseInsensitiveDict.lower_items [Lsyn]", "type": "function", "layer": "Lsyn", "file": "structures.py", "line": 63, "shape": "dot", "color": {"background": "#2563eb", "border": "#ffffff"}, "size": 12, "docstring": "Like iteritems(), but with all lowercase keys.", "code": "    def lower_items(self):\n        \"\"\"Like iteritems(), but with all lowercase keys.\"\"\"\n        return ((lowerkey, keyval[1]) for (lowerkey, keyval) in self._store.items())"}, {"id": "structures.py:CaseInsensitiveDict.__repr__", "label": "__repr__", "title": "structures.py:CaseInsensitiveDict.__repr__ [Lsyn]", "type": "function", "layer": "Lsyn", "file": "structures.py", "line": 79, "shape": "dot", "color": {"background": "#2563eb", "border": "#ffffff"}, "size": 12, "docstring": "", "code": "    def __repr__(self):\n        return str(dict(self.items()))"}, {"id": "structures.py:LookupDict.__init__", "label": "__init__", "title": "structures.py:LookupDict.__init__ [Lsyn]", "type": "function", "layer": "Lsyn", "file": "structures.py", "line": 86, "shape": "dot", "color": {"background": "#2563eb", "border": "#ffffff"}, "size": 12, "docstring": "", "code": "    def __init__(self, name=None):\n        self.name = name\n        super().__init__()"}, {"id": "structures.py:LookupDict.__getitem__", "label": "__getitem__", "title": "structures.py:LookupDict.__getitem__ [Lsyn]", "type": "function", "layer": "Lsyn", "file": "structures.py", "line": 93, "shape": "dot", "color": {"background": "#2563eb", "border": "#ffffff"}, "size": 12, "docstring": "", "code": "    def __getitem__(self, key):\n        # We allow fall-through here, so values default to None\n\n        return self.__dict__.get(key, None)"}, {"id": "utils.py:is_ipv4_address", "label": "is_ipv4_address", "title": "utils.py:is_ipv4_address [Lsyn]", "type": "function", "layer": "Lsyn", "file": "utils.py", "line": 698, "shape": "dot", "color": {"background": "#2563eb", "border": "#ffffff"}, "size": 12, "docstring": ":rtype: bool"
